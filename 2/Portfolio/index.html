Cielo granada · HTML
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cielo de Granada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        /* ============================================================
           VARIABLES PÚBLICAS
           El script las actualiza en cada momento del día para que el
           contenido del portfolio siempre tenga contraste con el cielo.
           ============================================================ */
        :root {
            --color-texto: #f7f8fb;
            --color-texto-suave: rgba(247, 248, 251, 0.72);
            --sombra-texto: 0 1px 24px rgba(3, 6, 20, 0.45);
            --acento: #f3c77b;

            /* Solo se usan si el navegador no tiene WebGL2 (respaldo) */
            --color-1: #fef3c7;
            --color-2: #e0f2fe;
            --color-3: #bae6fd;
            --color-4: #7dd3fc;
            --color-5: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            background: #03050d;
            color: var(--color-texto);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Lienzo del cielo: ocupa toda la ventana, siempre detrás */
        #cielo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        body.sin-webgl #cielo {
            display: none;
        }

        body.sin-webgl {
            background: linear-gradient(to bottom,
                    var(--color-5) 0%, var(--color-4) 35%, var(--color-3) 65%,
                    var(--color-2) 85%, var(--color-1) 100%);
        }

        /* ============================================================
           ZONA CENTRAL — aquí va el portfolio.
           El sol, la luna, los meteoros y el paisaje nunca la invaden.
           ============================================================ */
        .contenido {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 0 16px 14vh;
            text-align: center;
        }

        .contenido .antetitulo {
            margin: 0 0 18px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--color-texto-suave);
            transition: color 1.2s ease;
        }

        .contenido h1 {
            margin: 0;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 300;
            font-size: clamp(2.6rem, 7vw, 5.4rem);
            line-height: 1.02;
            letter-spacing: -0.01em;
            color: var(--color-texto);
            text-shadow: var(--sombra-texto);
            transition: color 1.2s ease, text-shadow 1.2s ease;
        }

        .contenido h1 em {
            font-style: italic;
            color: var(--acento);
            transition: color 1.2s ease;
        }

        .contenido .subtitulo {
            max-width: 34ch;
            margin: 22px auto 0;
            font-size: 15px;
            line-height: 1.6;
            color: var(--color-texto-suave);
            transition: color 1.2s ease;
        }

        /* ============================================================
           PANEL DEL RELOJ (abajo, en el centro: así no tapa al sol ni a
           la luna cuando salen o se ponen por los laterales)
           ============================================================ */
        .reloj {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            z-index: 5;
            width: min(660px, calc(100vw - 32px));
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 18px;
            padding: 10px 12px 10px 18px;
            border-radius: 16px;
            background: rgba(9, 13, 28, 0.34);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            color: #f4f6fb;
        }

        .reloj-hora {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 32px;
            font-weight: 300;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .reloj-fecha {
            margin-top: 3px;
            font-size: 11px;
            color: rgba(244, 246, 251, 0.72);
            white-space: nowrap;
        }

        .reloj-lugar {
            margin-right: 4px;
            font-size: 9.5px;
            font-weight: 500;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: rgba(244, 246, 251, 0.55);
        }

        .reloj-centro {
            min-width: 0;
        }

        .reloj-resumen {
            all: unset;
            display: block;
            cursor: default;
        }

        .reloj-resumen .reloj-hora,
        .reloj-resumen .reloj-fecha {
            display: block;
        }

        .reloj-estado {
            margin-bottom: 2px;
            font-size: 11.5px;
            color: rgba(244, 246, 251, 0.72);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Deslizador: la pista muestra los colores reales del día */
        #slider-hora {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            height: 18px;
            margin: 0;
            background: transparent;
            cursor: pointer;
        }

        #slider-hora::-webkit-slider-runnable-track {
            height: 5px;
            border-radius: 5px;
            background: var(--pista, linear-gradient(90deg, #0b1020, #6aa6e0, #0b1020));
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        #slider-hora::-moz-range-track {
            height: 5px;
            border-radius: 5px;
            background: var(--pista, linear-gradient(90deg, #0b1020, #6aa6e0, #0b1020));
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        #slider-hora::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            margin-top: -5px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.16), 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        #slider-hora::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.16), 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        #slider-hora:focus-visible {
            outline: none;
        }

        #slider-hora:focus-visible::-webkit-slider-thumb {
            box-shadow: 0 0 0 4px rgba(243, 199, 123, 0.6);
        }

        .reloj-controles {
            display: flex;
            gap: 4px;
        }

        .btn-vel {
            padding: 7px 10px;
            border: none;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.07);
            color: rgba(244, 246, 251, 0.8);
            font: 500 11.5px 'Inter', system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .btn-vel:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        .btn-vel:focus-visible {
            outline: 2px solid rgba(243, 199, 123, 0.7);
            outline-offset: 1px;
        }

        .btn-vel.activo {
            background: rgba(255, 255, 255, 0.9);
            color: #0b1226;
        }

        @media (max-width: 640px) {
            .reloj {
                bottom: 12px;
                width: calc(100vw - 24px);
                grid-template-columns: auto 1fr;
                gap: 8px 14px;
                padding: 10px 12px 12px 14px;
            }

            .reloj-controles {
                grid-column: 1 / -1;
            }

            .btn-vel {
                flex: 1;
            }

            /* En el móvil el panel se pliega para no tapar el paisaje */
            .reloj-resumen {
                cursor: pointer;
                border-radius: 8px;
            }

            .reloj-resumen:focus-visible {
                outline: 2px solid rgba(243, 199, 123, 0.7);
                outline-offset: 3px;
            }

            .reloj:not(.abierto) {
                width: min(340px, calc(100vw - 24px));
                padding: 8px 14px;
            }

            .reloj:not(.abierto) #slider-hora,
            .reloj:not(.abierto) .reloj-controles {
                display: none;
            }

            .reloj:not(.abierto) .reloj-hora {
                font-size: 26px;
            }
        }
    </style>
</head>

    <!-- ============================================================
         SHADERS
         ============================================================ -->
    <script id="vs" type="x-shader/x-vertex">#version 300 es
        in vec2 aPos;
        void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
    </script>

    <script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 fragColor;
 
// --- Pantalla y proyección ---
uniform vec2  uRes;
uniform float uAspect, uTime;
uniform vec2  uPan;          // x panorámica = uv.x * uPan.x + uPan.y
uniform float uPanAspect;    // ancho panorámico / alto de pantalla
uniform float uHorizon, uDegPerY, uBand;
 
// --- Sol ---
uniform vec3  uSunDir;       // dirección en la proyección de pantalla (para la dispersión)
uniform vec2  uSunPos;
uniform float uSunRadius, uSunFlat;
uniform vec3  uSunDisk, uGlare;
uniform float uExposure, uAtmos;
uniform vec3  uMS;           // aproximación de dispersión múltiple
 
// --- Luna ---
uniform vec2  uMoonPos;
uniform float uMoonRadius;
uniform vec3  uMoonL, uMoonTint, uMoonHalo;
uniform float uMoonFrac, uMoonBright, uMoonSky;
 
// --- Cielo nocturno ---
uniform float uStarVis, uMilky, uTwinkle;
uniform mat3  uToEq;         // de la cámara a coordenadas ecuatoriales (incluye la rotación sidérea)
 
// --- Iluminación del paisaje ---
uniform vec3  uSunGround, uSunHigh, uSunCirrus, uAmb, uAmbLand, uMoonLight, uLightDir, uMoonLightDir, uCityGlow;
uniform float uLights, uWindows, uSnow, uMist, uCover, uBloom;
uniform vec2  uWind;
 
// --- Estrella fugaz ---
uniform vec4  uMeteor;
uniform float uMeteorT;
 
uniform sampler2D uAlb, uEmi, uInf;
 
const float PI  = 3.14159265359;
const float R_P = 6371e3;
const float R_A = 6471e3;
const vec3  B_R = vec3(5.8e-6, 13.5e-6, 33.1e-6);
const float B_M = 8e-6;
const vec3  B_O = vec3(0.650e-6, 1.881e-6, 0.085e-6);
const float H_R = 8000.0;
const float H_M = 1200.0;
const float G_M = 0.80;
 
// Polo norte galáctico y centro galáctico (J2000, ecuatoriales)
const vec3 NGP = vec3(-0.8676, -0.1981, 0.4560);
const vec3 GCN = vec3(-0.0549, -0.8734, -0.4839);
 
// ------------------------------------------------------------
// Ruido
// ------------------------------------------------------------
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3) { p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec2  hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
vec3  hash33(vec3 p3) { p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
 
float noise1(float x) { float i = floor(x), f = fract(x); float u = f * f * (3.0 - 2.0 * f); return mix(hash12(vec2(i, 1.7)), hash12(vec2(i + 1.0, 1.7)), u); }
float noise2(vec2 p) {
    vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float noise3(vec3 p) {
    vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
    float a = hash13(i), b = hash13(i + vec3(1, 0, 0)), c = hash13(i + vec3(0, 1, 0)), d = hash13(i + vec3(1, 1, 0));
    float e = hash13(i + vec3(0, 0, 1)), g = hash13(i + vec3(1, 0, 1)), h = hash13(i + vec3(0, 1, 1)), k = hash13(i + vec3(1, 1, 1));
    return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, g, u.x), mix(h, k, u.x), u.y), u.z);
}
float fbm1(float x) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise1(x); x = x * 2.03 + 3.1; a *= 0.5; } return s; }
float fbm2(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) { s += a * noise2(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 1.7; a *= 0.5; }
    return s;
}
float fbm3(vec3 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise3(p); p = p * 2.07 + 1.3; a *= 0.5; } return s; }
float gauss(float x, float c, float w) { float d = (x - c) / w; return exp(-d * d); }
float pico(float x, float c, float w, float h) { return h * pow(max(0.0, 1.0 - abs(x - c) / w), 1.6); }
 
// ------------------------------------------------------------
// Proyección: cada píxel es una dirección del cielo.
// El sol y la luna usan la misma proyección, así su halo cae justo donde se dibujan.
// ------------------------------------------------------------
vec3 dirDesdeUV(vec2 uv) {
    float el = radians((uv.y - uHorizon) * uDegPerY);
    float az = radians((uv.x - 0.5) * uAspect * uDegPerY);
    return vec3(sin(az) * cos(el), sin(el), -cos(az) * cos(el));
}
 
// ------------------------------------------------------------
// Dispersión atmosférica (Rayleigh + Mie + ozono, dispersión simple)
// ------------------------------------------------------------
vec2 rsi(vec3 o, vec3 d, float r) {
    float b = 2.0 * dot(d, o);
    float c = dot(o, o) - r * r;
    float disc = b * b - 4.0 * c;
    if (disc < 0.0) return vec2(1e9, -1e9);
    disc = sqrt(disc);
    return vec2(-b - disc, -b + disc) * 0.5;
}
 
vec3 atmosfera(vec3 rd, vec3 sd) {
    vec3 o = vec3(0.0, R_P + 800.0, 0.0);
    float L = rsi(o, rd, R_A).y;
    vec2 pg = rsi(o, rd, R_P);
    if (pg.x < pg.y && pg.x > 0.0) L = min(L, pg.x);
 
    float mu = dot(rd, sd);
    float mumu = mu * mu, gg = G_M * G_M;
    float pR = 3.0 / (16.0 * PI) * (1.0 + mumu);
    float pM = 3.0 / (8.0 * PI) * ((1.0 - gg) * (mumu + 1.0)) / (pow(1.0 + gg - 2.0 * mu * G_M, 1.5) * (2.0 + gg));
 
    vec3 tR = vec3(0.0), tM = vec3(0.0);
    float oR = 0.0, oM = 0.0, oO = 0.0, prev = 0.0;
    for (int i = 0; i < 12; i++) {
        float f = (float(i) + 1.0) / 12.0;
        float t1 = L * f * f;              // pasos más finos cerca del observador
        float ds = t1 - prev;
        float tm = prev + 0.5 * ds;
        prev = t1;
        vec3 p = o + rd * tm;
        float h = length(p) - R_P;
        float dR = exp(-h / H_R) * ds;
        float dM = exp(-h / H_M) * ds;
        float dO = max(0.0, 1.0 - abs(h - 25e3) / 15e3) * ds;
        oR += dR; oM += dM; oO += dO;
 
        vec2 pl = rsi(p, sd, R_P);
        if (pl.x < pl.y && pl.x > 0.0) continue;   // sombra de la Tierra
        float Lj = rsi(p, sd, R_A).y;
        float dj = Lj / 5.0;
        float jR = 0.0, jM = 0.0, jO = 0.0;
        for (int j = 0; j < 5; j++) {
            float hj = length(p + sd * (dj * (float(j) + 0.5))) - R_P;
            jR += exp(-hj / H_R);
            jM += exp(-hj / H_M);
            jO += max(0.0, 1.0 - abs(hj - 25e3) / 15e3);
        }
        vec3 at = exp(-(B_R * (oR + jR * dj) + B_M * 1.1 * (oM + jM * dj) + B_O * (oO + jO * dj)));
        tR += dR * at;
        tM += dM * at;
    }
    return 22.0 * (pR * B_R * tR + pM * B_M * tM);
}
 
// ------------------------------------------------------------
// Estrellas y Vía Láctea
// ------------------------------------------------------------
vec3 capaEstrellas(vec3 d, float pix, float escala, float umbral, float brillo, float semilla) {
    vec3 p = d * escala;
    vec3 id = floor(p);
    if (hash13(id + semilla) > umbral) return vec3(0.0);
    vec3 h = hash33(id + semilla * 1.7);
    vec3 sp = id + 0.25 + 0.5 * h;
    float dist = length(p - sp);
    float mag = pow(hash13(id + semilla + 5.31), 7.0);
    float r = min(pix * escala * (0.8 + 1.7 * mag), 0.24);
    float b = exp(-dist * dist / (r * r)) * (0.035 + 3.6 * mag) * brillo;
    float tw = 1.0 + uTwinkle * (sin(uTime * (2.5 + 6.0 * h.x) + h.y * 40.0) * 0.5 + sin(uTime * (5.3 + 3.0 * h.z) + h.x * 17.0) * 0.3);
    vec3 tinte = mix(vec3(0.72, 0.80, 1.0), vec3(1.0, 0.85, 0.66), smoothstep(0.2, 0.95, hash13(id + semilla + 9.7)));
    return tinte * b * tw;
}
 
vec3 viaLactea(vec3 d, out float densidad) {
    float b = dot(d, NGP);
    float gc = dot(d, GCN);
    float banda = exp(-b * b / 0.040);
    float nucleo = exp(-b * b / 0.0075);
    float bulbo = smoothstep(-0.3, 1.0, gc);
    float n = fbm3(d * 5.0);
    float polvo = smoothstep(0.44, 0.70, fbm3(d * 13.0 + 4.0)) * exp(-b * b / 0.006) * (0.45 + 0.55 * bulbo);
    float m = (banda * 0.42 + nucleo * 0.8) * (0.35 + 1.0 * n) * (0.5 + 0.9 * bulbo);
    m *= 1.0 - 0.88 * polvo;
    densidad = banda;
    vec3 c = mix(vec3(0.60, 0.68, 0.95), vec3(1.0, 0.88, 0.72), clamp(nucleo * bulbo * 1.3, 0.0, 1.0));
    return c * m;
}
 
// ------------------------------------------------------------
// Nubes (cirros altos + cúmulos/altocúmulos con sombra propia)
// ------------------------------------------------------------
float hg(float mu, float g) { float gg = g * g; return (1.0 - gg) / (4.0 * PI * pow(1.0 + gg - 2.0 * g * mu, 1.5)); }
 
vec4 nubes(vec3 rd, vec2 uv, vec3 haze) {
    if (rd.y < 0.012 || uCover < 0.01) return vec4(0.0);
    // Las nubes se aclaran detrás del contenido central
    float cm = 1.0 - smoothstep(0.10, 0.38, length((uv - vec2(0.5, 0.54)) * vec2(min(uAspect, 1.9) * 0.6, 1.0)));
    float mu = dot(rd, uSunDir);
    vec3 acc = vec3(0.0);
    float alpha = 0.0;
 
    // Cirros
    {
        float t = 2.6 / rd.y;
        vec2 p = rd.xz * t * 0.16 + uWind * 0.45;
        float s = fbm2(vec2(p.x * 0.55, p.y * 3.4) + vec2(0.0, uWind.x * 0.2));
        float m = fbm2(p * 0.5 + 11.0);
        float d = smoothstep(0.50, 0.84, s) * smoothstep(0.35, 0.75, m) * smoothstep(0.0, 0.5, uCover + 0.15);
        vec3 c = uSunCirrus * (0.85 + 3.0 * hg(mu, 0.55)) + uAmb * 0.95 + uCityGlow * 0.6 + uMoonLight * 0.8;
        c = mix(haze, c, exp(-t * 0.035));
        d *= 0.55 * smoothstep(0.015, 0.15, rd.y) * (1.0 - 0.5 * cm);
        acc = c * d;
        alpha = d;
    }
 
    // Cúmulos
    {
        float t = 1.0 / rd.y;
        vec2 p = rd.xz * t * 0.42 + uWind;
        vec2 q = p + vec2(fbm2(p * 0.7 + uWind * 0.2), fbm2(p * 0.7 + 5.2 - uWind * 0.15)) * 0.6;
        float det = fbm2(q * 4.1 + uWind * 0.9);
        float n = fbm2(q * 1.15) * 0.78 + det * 0.32;
        float umb = 1.02 - uCover * 0.62;
        float d = smoothstep(umb, umb + 0.22, n);
        if (d > 0.002) {
            vec2 sdir = normalize(uSunDir.xz + vec2(1e-4));
            float nl = fbm2((q + sdir * 0.09) * 1.15) * 0.78 + det * 0.32;
            float sombra = exp(-smoothstep(umb, umb + 0.22, nl) * 2.4);
            float espesor = smoothstep(0.0, 1.0, d);
            vec3 c = uSunHigh * (0.3 + 0.7 * sombra) * (hg(mu, 0.62) * 2.6 + 0.45);
            c += uSunHigh * hg(mu, 0.85) * (1.0 - espesor) * 1.5;            // bordes plateados
            c += uAmb * (0.95 - 0.4 * espesor);
            c += uMoonLight * (0.5 + 0.5 * sombra) + uCityGlow * (2.2 + 1.5 * espesor);
            c = mix(haze, c, exp(-t * 0.05));
            d *= smoothstep(0.012, 0.10, rd.y) * (1.0 - 0.6 * cm);
            acc = c * d + acc * (1.0 - d);
            alpha = d + alpha * (1.0 - d);
        }
    }
    return vec4(acc, alpha);
}
 
// ------------------------------------------------------------
// Relieve lejano: Sierra Nevada y colinas
// (perfil fijo en coordenadas panorámicas, igual que en JS)
// ------------------------------------------------------------
float sierraY(float xv) {
    float nx = xv * uPanAspect;
    float y = 0.207;
    y += 0.010 * gauss(xv, 0.10, 0.08) + 0.006 * gauss(xv, 0.20, 0.05);   // Sierra de Huétor
    y += 0.010 * gauss(xv, 0.50, 0.16);                                     // estribaciones
    y += 0.018 * gauss(xv, 0.74, 0.11);                                     // macizo central
    y += pico(xv, 0.620, 0.040, 0.008);
    y += pico(xv, 0.690, 0.050, 0.016);                                     // Veleta
    y += pico(xv, 0.785, 0.060, 0.030);                                     // Mulhacén
    y += pico(xv, 0.845, 0.035, 0.022);                                     // Alcazaba
    y -= 0.006 * smoothstep(0.88, 0.95, xv);                                // la Vega
    float r = 0.0, a = 0.5, f = 5.0;
    for (int i = 0; i < 6; i++) { float n = noise1(nx * f + float(i) * 7.3); r += a * (1.0 - abs(2.0 * n - 1.0)); a *= 0.55; f *= 2.05; }
    float relieve = smoothstep(0.0, 0.03, y - 0.207);
    return y + (r - 0.5) * (0.003 + 0.014 * relieve);
}
 
float colinasY(float xv) {
    float nx = xv * uPanAspect;
    float y = 0.176 + 0.014 * gauss(xv, 0.60, 0.16) + 0.006 * gauss(xv, 0.08, 0.10) - 0.016 * smoothstep(0.80, 0.98, xv);
    return y + (fbm1(nx * 2.6) - 0.5) * 0.012 + (noise1(nx * 30.0) - 0.5) * 0.0015;
}
 
vec3 capaSierra(vec2 uv, float xv, float yS, vec3 haze) {
    float e = 0.0015;
    float s = (sierraY(xv + e) - sierraY(xv - e)) / (2.0 * e) / uPanAspect;
    float nx = xv * uPanAspect;
    float hb = smoothstep(0.205, 0.27, yS);
    float prof = clamp((yS - uv.y) / max(yS - 0.198, 0.004), 0.0, 1.0);
    vec2 pr = vec2(nx * 60.0, uv.y * 55.0);
    float carcava = fbm2(pr);
    float grano = noise2(vec2(nx * 260.0, uv.y * 120.0));
    float gx = fbm2(pr + vec2(0.35, 0.0)) - fbm2(pr - vec2(0.35, 0.0));
    float gy = fbm2(pr + vec2(0.0, 0.35)) - carcava;
    float cerca = 1.0 - smoothstep(0.0, 0.3, prof);
    vec3 n = normalize(vec3(-s * 2.2 * cerca + gx * 2.2, 0.45 - prof * 0.25 + gy * 1.5, 1.0));
 
    float espesor = uSnow * 0.055 * pow(hb, 1.5) * (0.5 + 0.9 * carcava);
    float nieve = smoothstep(-0.001, 0.001, uv.y - (yS - espesor) + (grano - 0.5) * 0.004) * smoothstep(0.0005, 0.002, espesor);
 
    vec3 roca = mix(vec3(0.17, 0.16, 0.155), vec3(0.11, 0.12, 0.09), smoothstep(0.3, 0.9, prof));
    roca *= 0.82 + 0.36 * carcava;
    vec3 alb = mix(roca, vec3(0.86, 0.88, 0.92), nieve);
 
    float lam = max(dot(n, uLightDir), 0.0);
    float lamM = max(dot(n, uMoonLightDir), 0.0);
    vec3 sol = mix(uSunGround, uSunHigh, hb * (1.0 - prof));   // las cumbres conservan la luz más tiempo
    vec3 lit = alb * (sol * lam * 1.05 + uAmbLand * 0.75 + uMoonLight * lamM * 1.4);
    float bruma = clamp(0.24 + 0.16 * prof - 0.08 * hb + uMist * 0.18, 0.0, 0.9);
    return mix(lit, haze, bruma);
}
 
vec3 capaColinas(vec2 uv, float xv, vec3 haze) {
    float nx = xv * uPanAspect;
    float e = 0.0015;
    float s = (colinasY(xv + e) - colinasY(xv - e)) / (2.0 * e) / uPanAspect;
    float prof = clamp((colinasY(xv) - uv.y) / 0.04, 0.0, 1.0);
    s *= 1.0 - smoothstep(0.0, 0.4, prof);
    vec2 pc = vec2(nx * 90.0, uv.y * 90.0);
    float tex = fbm2(pc);
    float gx = fbm2(pc + vec2(0.4, 0.0)) - tex;
    float arb = smoothstep(0.45, 0.7, noise2(vec2(nx * 420.0, uv.y * 260.0)));
    vec3 alb = mix(vec3(0.13, 0.12, 0.08), vec3(0.07, 0.09, 0.05), arb) * (0.8 + 0.4 * tex);
    vec3 n = normalize(vec3(-s * 2.0 + gx * 2.0, 0.5, 1.0));
    float lam = max(dot(n, uLightDir) * 0.8 + 0.2, 0.0);
    vec3 lit = alb * (uSunGround * lam + uAmbLand * 0.75 + uMoonLight * 0.5);
    return mix(lit, haze, 0.30 + uMist * 0.2);
}
 
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
 
void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec2 asp = vec2(uAspect, 1.0);
    float xv = uv.x * uPan.x + uPan.y;
    vec3 rd = dirDesdeUV(uv);
    vec3 rdS = rd;
    if (rdS.y < 0.007) { rdS.y = 0.007; rdS = normalize(rdS); }
 
    // ---- ¿Qué tapa el paisaje? ----
    float yS = sierraY(xv);
    float yC = colinasY(xv);
    vec2 tuv = vec2(uv.x, uv.y / uBand);
    vec4 alb = tuv.y < 1.0 ? texture(uAlb, tuv) : vec4(0.0);
    bool cieloVisible = uv.y >= yS && alb.a < 0.995;
 
    // ---- Cielo ----
    vec3 sky = uAtmos > 0.5 ? atmosfera(rdS, uSunDir) * uExposure : vec3(0.0);
    sky += uMS * (0.75 + 0.25 * (1.0 - rdS.y));
    float elN = max(rd.y, 0.0);
    vec3 noche = mix(vec3(0.0060, 0.0088, 0.020), vec3(0.0020, 0.0032, 0.0080), pow(elN, 0.55));
    noche += uCityGlow * exp(-elN * 7.0);
    noche += uMoonSky * mix(vec3(0.012, 0.020, 0.042), vec3(0.006, 0.011, 0.026), elN);
    sky += noche;
    vec3 haze = sky;     // color de la perspectiva aérea (sin astros ni nubes)
    vec3 col = sky;
 
    if (cieloVisible) {
        float lumCielo = dot(sky, vec3(0.2126, 0.7152, 0.0722));
        float puerta = 1.0 - smoothstep(0.012, 0.11, lumCielo);   // las estrellas solo se ven si el cielo es oscuro
 
        // Estrellas y Vía Láctea
        float tapaLuna = 0.0;
        vec2 dm = (uv - uMoonPos) * asp;
        float rm = length(dm) / uMoonRadius;
        if (uMoonBright > 0.0) tapaLuna = 1.0 - smoothstep(0.96, 1.0, rm);
 
        if (uStarVis > 0.003 && puerta > 0.0) {
            vec3 dEq = uToEq * rd;
            float pix = radians(uDegPerY) / uRes.y;
            float ext = exp(-0.12 / max(rd.y, 0.03));
            float densMW = 0.0;
            vec3 mw = uMilky > 0.003 ? viaLactea(dEq, densMW) : vec3(0.0);
            vec3 st = capaEstrellas(dEq, pix, 70.0, 0.12, 1.0, 1.0);
            st += capaEstrellas(dEq, pix, 170.0, 0.10, 0.45, 2.0);
            st += capaEstrellas(dEq, pix, 400.0, 0.025 + 0.30 * densMW * uMilky, 0.30, 3.0);
            float centro = 1.0 - smoothstep(0.12, 0.40, length((uv - vec2(0.5, 0.52)) * vec2(min(uAspect, 1.9) * 0.6, 1.0)));
            col += (st * uStarVis * (1.0 - 0.55 * centro) + mw * 0.055 * uMilky * (1.0 - 0.35 * centro)) * ext * puerta * (1.0 - tapaLuna);
        }
 
        // Luna (fase real, mares, cráteres y luz cenicienta)
        if (uMoonBright > 0.0) {
            float dmo = length(dm);
            col += uMoonHalo * (exp(-dmo * 22.0) * 0.30 + exp(-dmo * 5.0) * 0.06);
            if (rm < 1.0) {
                vec2 q = dm / uMoonRadius;
                vec3 n = vec3(q, sqrt(max(0.0, 1.0 - dot(q, q))));
                float mares = smoothstep(0.42, 0.62, fbm2(q * 2.1 + vec2(3.1, 7.7)));
                float a = mix(1.0, 0.58, mares) * (0.9 + 0.2 * noise2(q * 22.0));
                vec2 cp = q * 4.2; vec2 ci = floor(cp); vec2 cf = fract(cp);
                for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
                    vec2 g = vec2(float(x), float(y));
                    vec2 o = hash22(ci + g);
                    float rad = 0.12 + 0.22 * hash12(ci + g + 3.1);
                    float dd = length(g + o - cf) / rad;
                    a *= mix(0.84, 1.0, smoothstep(0.6, 1.0, dd)) * (1.0 + 0.10 * exp(-pow((dd - 1.0) * 6.0, 2.0)));
                }
                float ndl = dot(n, uMoonL);
                float ls = ndl > 0.0 ? min(2.0 * ndl / (ndl + n.z + 0.05), 1.15) : 0.0;
                ls *= smoothstep(-0.02, 0.08, ndl);
                float ceniza = 0.018 * (1.0 - uMoonFrac) * (1.0 - smoothstep(-0.05, 0.05, ndl));
                float borde = 1.0 - smoothstep(0.965, 1.0, rm);
                col += uMoonTint * a * (ls + ceniza) * uMoonBright * borde;
            }
        }
 
        // Disco solar con oscurecimiento del limbo
        vec2 dsv = (uv - uSunPos) * asp;
        dsv.y /= uSunFlat;
        float rS = length(dsv) / uSunRadius;
        if (rS < 1.0) {
            float limbo = 1.0 - 0.55 * (1.0 - sqrt(max(0.0, 1.0 - rS * rS)));
            col += uSunDisk * limbo * (1.0 - smoothstep(0.9, 1.0, rS));
        }
 
        // Estrella fugaz
        if (uMeteorT >= 0.0) {
            vec2 P = uv * asp;
            vec2 cabeza = uMeteor.xy + uMeteor.zw * uMeteorT;
            vec2 cola = uMeteor.xy + uMeteor.zw * max(uMeteorT - 0.35, 0.0);
            vec2 pa = P - cola, ba = cabeza - cola;
            float hh = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-7), 0.0, 1.0);
            float dist = length(pa - ba * hh);
            float w = 1.6 / uRes.y;
            col += vec3(0.85, 0.9, 1.0) * exp(-dist * dist / (w * w)) * hh * hh * sin(PI * uMeteorT) * 1.8 * uStarVis * puerta;
        }
 
        // Nubes
        vec4 nb = nubes(rd, uv, haze);
        col = col * (1.0 - nb.a) + nb.rgb;
    }
 
    // ---- Sierra Nevada ----
    if (uv.y < yS) col = capaSierra(uv, xv, yS, haze);
    // ---- Colinas intermedias ----
    if (uv.y < yC) col = capaColinas(uv, xv, haze);
 
    // ---- Bruma de la Vega ----
    if (uMist > 0.01) {
        float m = uMist * exp(-max(0.0, uv.y - 0.172) / 0.014) * smoothstep(0.09, 0.16, uv.y);
        m *= 0.55 + 0.45 * fbm2(vec2(xv * uPanAspect * 2.2 + uWind.x * 0.05, uv.y * 22.0));
        vec3 mc = mix(haze, uSunGround * 0.55 + uAmb * 0.9, 0.45);
        col = mix(col, mc, clamp(m, 0.0, 0.85));
    }
 
    // ---- Alhambra, Albaicín y ciudad (texturas pintadas, iluminadas aquí) ----
    if (alb.a > 0.003) {
        vec4 inf = texture(uInf, tuv);
        vec3 emi = texture(uEmi, tuv).rgb;
        float prof = inf.r;
        float fx = inf.g * 2.0 - 1.0;
        float tag = inf.b;
        vec3 n; float kA; float wrap = 0.0;
        if (tag < 0.15)      { n = normalize(vec3(fx, 0.18, 1.0 - abs(fx) * 0.65)); kA = 0.75; }   // muros
        else if (tag < 0.32) { n = normalize(vec3(fx * 0.35, 0.85, 0.5)); kA = 0.8; }               // tejados
        else if (tag < 0.46) { n = normalize(vec3(fx * 0.5, 0.6, 0.62)); kA = 0.48; wrap = 0.2; }   // vegetación
        else                 { n = vec3(0.0, 0.0, 1.0); kA = 0.35; }                                // ventanas
        float lam = clamp((dot(n, uLightDir) + wrap) / (1.0 + wrap), 0.0, 1.0);
        float lamM = clamp((dot(n, uMoonLightDir) + wrap) / (1.0 + wrap), 0.0, 1.0);
        vec3 a = pow(alb.rgb / max(alb.a, 1e-3), vec3(2.2)) * (0.9 + 0.2 * noise2(gl_FragCoord.xy * 0.5));
        if (tag >= 0.32 && tag < 0.46) a *= 0.5 + 0.8 * noise2(gl_FragCoord.xy * 0.55);   // textura de hojas
        vec3 sol = mix(uSunGround, uSunHigh, prof * 0.3);
        vec3 lit = a * (sol * lam + uAmbLand * kA + uMoonLight * lamM);
        float on = uLights;
        if (tag >= 0.46) {
            on *= step((tag - 0.5) * 2.0, uWindows);
            lit += haze * 0.10 * (1.0 - on);                 // el cristal refleja el cielo
        }
        float detalle = 1.0;
        if (tag < 0.15) {   // la luz de los focos deja ver la textura de la piedra y la cal
            vec4 albS = textureLod(uAlb, tuv, 3.0);
            const vec3 LW = vec3(0.2126, 0.7152, 0.0722);
            detalle = clamp((dot(alb.rgb, LW) / max(alb.a, 1e-3)) / max(dot(albS.rgb, LW) / max(albS.a, 1e-3), 0.02), 0.45, 1.6);
        }
        lit += pow(emi, vec3(2.2)) * 0.95 * on * detalle;
        lit = mix(lit, haze, clamp(prof * prof * 0.6 + uMist * prof * 0.25, 0.0, 0.8));
        col = mix(col, lit, alb.a);
    }
 
    // ---- Halo de las luces ----
    if (uLights > 0.01) {
        vec2 tb = vec2(uv.x, clamp(uv.y / uBand, 0.0, 1.0));
        vec3 b1 = textureLod(uEmi, tb, 3.0).rgb;
        vec3 b2 = textureLod(uEmi, tb, 5.0).rgb;
        vec3 b3 = textureLod(uEmi, tb, 7.0).rgb;
        vec3 bl = b1 * b1 * 0.45 + b2 * b2 * 0.55 + b3 * b3 * 0.75;
        col += bl * uLights * uBloom * (1.0 - smoothstep(uBand * 0.9, uBand * 1.2, uv.y));
    }
 
    // ---- Resplandor del sol ----
    vec2 dg = (uv - uSunPos) * asp;
    float dgl = length(dg);
    col += uGlare * (exp(-dgl * 60.0) * 0.6 + exp(-dgl * 10.0) * 0.10 + exp(-dgl * 2.5) * 0.025);
 
    // ---- Revelado ----
    col *= mix(1.0, 0.86, smoothstep(0.55, 1.3, length((uv - 0.5) * vec2(min(uAspect, 2.0) * 0.8, 1.0))));
    col = aces(col);
    float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
    col = mix(vec3(l), col, 1.1);
    col = pow(max(col, 0.0), vec3(1.0 / 2.2));
    col += (hash12(gl_FragCoord.xy + fract(uTime * 7.13) * 91.0) - 0.5) * (1.5 / 255.0);
    fragColor = vec4(col, 1.0);
}

    <script>
        'use strict';
        /* ================================================================
           CIELO DE GRANADA — cómo usarlo en el portfolio
           ----------------------------------------------------------------
           · Tu contenido va dentro de <main class="contenido">. El sol, la
             luna, las estrellas fugaces y el panel respetan esa zona.
           · Variables CSS que se actualizan solas según el cielo:
               --color-texto, --color-texto-suave, --sombra-texto, --acento
             y el atributo <html data-fase="noche|hora-azul|alba|amanecer|dia|hora-dorada|ocaso">.
           · Evento para reaccionar desde JS:
               window.addEventListener('cielo:cambio', e => console.log(e.detail));
           · Parámetros de URL para probar:
               ?hora=20.5   ?fecha=2026-12-24   ?vel=600   ?nubes=0.6   ?calidad=1
           · Muestra el cielo real de Granada (sol y luna calculados para la
             fecha y hora de Granada), venga de donde venga la visita.
           ================================================================ */

        // ================================================================
        //  CONFIGURACIÓN
        // ================================================================
        const CONFIG = {
            latitud: 37.1773,           // Granada
            longitud: -3.5986,
            zonaHoraria: 'Europe/Madrid',
            azimutCamara: 150,          // la escena mira al SSE, como desde el Mirador de San Nicolás
            horizonte: 0.20,            // altura del horizonte (fracción de pantalla desde abajo)
            cimaY: 0.925,               // altura que alcanza el sol en su punto más alto
            gradosCima: 55,             // elevación visual que corresponde a cimaY
            margenX: 0.46,              // el sol sube a 4 % del borde lateral
            banda: 0.36,                // alto de la franja de paisaje pintado
            radioSol: 0.009,            // radios en fracción del alto de pantalla
            radioLuna: 0.014,
            calidadInicial: 1.0,        // escala de resolución del render (se adapta sola)
        };
        const GRADOS_POR_Y = CONFIG.gradosCima / (CONFIG.cimaY - CONFIG.horizonte);

        const RAD = Math.PI / 180, DEG = 180 / Math.PI;
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        const fract = x => x - Math.floor(x);
        const mix = (a, b, t) => a + (b - a) * t;
        const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
        const v3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
        const lum = v => 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
        const reducirMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ================================================================
        //  RESPALDO: tu paleta de keyframes (solo si no hay WebGL2)
        // ================================================================
        const cicloCielo = [
            { hora: 0, c1: '#020617', c2: '#050816', c3: '#0b1026', c4: '#0f172a', c5: '#020617' },
            { hora: 3, c1: '#040714', c2: '#070b1e', c3: '#0a1028', c4: '#0c1430', c5: '#01030d' },
            { hora: 6.5, c1: '#312e81', c2: '#4c1d95', c3: '#1e1b4b', c4: '#0f172a', c5: '#020617' },
            { hora: 7.75, c1: '#fdba74', c2: '#f9a8d4', c3: '#c4b5fd', c4: '#6366f1', c5: '#1e3a8a' },
            { hora: 9, c1: '#fef3c7', c2: '#bae6fd', c3: '#7dd3fc', c4: '#38bdf8', c5: '#0284c7' },
            { hora: 11, c1: '#f0f9ff', c2: '#e0f2fe', c3: '#7dd3fc', c4: '#0ea5e9', c5: '#0369a1' },
            { hora: 14, c1: '#f8fafc', c2: '#bae6fd', c3: '#38bdf8', c4: '#0ea5e9', c5: '#0369a1' },
            { hora: 17, c1: '#fef08a', c2: '#bae6fd', c3: '#7dd3fc', c4: '#38bdf8', c5: '#0284c7' },
            { hora: 19, c1: '#fde047', c2: '#fb923c', c3: '#7dd3fc', c4: '#0ea5e9', c5: '#1e3a8a' },
            { hora: 20.25, c1: '#f97316', c2: '#f472b6', c3: '#a78bfa', c4: '#4338ca', c5: '#1e1b4b' },
            { hora: 21.5, c1: '#581c87', c2: '#312e81', c3: '#1e1b4b', c4: '#0f172a', c5: '#020617' }
        ];
        const hexARgb = hex => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
        const rgbAHex = ([r, g, b]) => '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
        const lerpColor = (h1, h2, t) => { const a = hexARgb(h1), b = hexARgb(h2); return rgbAHex(a.map((v, i) => mix(v, b[i], t))); };
        function cieloEnHora(hora) {
            const h = ((hora % 24) + 24) % 24, n = cicloCielo.length;
            let i = n - 1;
            for (let k = 0; k < n; k++) if (cicloCielo[k].hora <= h) i = k;
            const a = cicloCielo[i], b = cicloCielo[(i + 1) % n];
            const fin = b.hora > a.hora ? b.hora : b.hora + 24;
            const t = ((h >= a.hora ? h : h + 24) - a.hora) / (fin - a.hora);
            const e = {};
            for (const c of ['c1', 'c2', 'c3', 'c4', 'c5']) e[c] = lerpColor(a[c], b[c], t);
            return e;
        }

        // ================================================================
        //  HORA DE GRANADA
        // ================================================================
        const fmtZona = new Intl.DateTimeFormat('en-US', {
            timeZone: CONFIG.zonaHoraria, hourCycle: 'h23',
            year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        const cacheDesfase = new Map();
        function desfaseMin(ms) {
            const k = Math.floor(ms / 3600e3);
            if (cacheDesfase.has(k)) return cacheDesfase.get(k);
            const p = {};
            for (const { type, value } of fmtZona.formatToParts(new Date(k * 3600e3))) p[type] = +value;
            const comoUTC = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
            const d = Math.round((comoUTC - k * 3600e3) / 60000);
            if (cacheDesfase.size > 500) cacheDesfase.clear();
            cacheDesfase.set(k, d);
            return d;
        }
        function horaLocal(ms) {
            const l = new Date(ms + desfaseMin(ms) * 60000);
            return {
                y: l.getUTCFullYear(), mes: l.getUTCMonth(), dia: l.getUTCDate(), dow: l.getUTCDay(),
                horas: l.getUTCHours() + l.getUTCMinutes() / 60 + l.getUTCSeconds() / 3600 + l.getUTCMilliseconds() / 3600e3
            };
        }
        function msDesdeLocal(y, mes, dia, horas) {
            let ms = Date.UTC(y, mes, dia) + horas * 3600e3;
            for (let i = 0; i < 2; i++) ms = Date.UTC(y, mes, dia) + horas * 3600e3 - desfaseMin(ms) * 60000;
            return ms;
        }
        function diaDelAno(ms) {
            const l = horaLocal(ms);
            return Math.floor((Date.UTC(l.y, l.mes, l.dia) - Date.UTC(l.y, 0, 0)) / 864e5);
        }

        // ================================================================
        //  ASTRONOMÍA (precisión de ~1°, suficiente para ver el cielo real)
        // ================================================================
        const diasJ2000 = ms => ms / 864e5 + 2440587.5 - 2451545.0;

        function solEcuatorial(n) {
            const L = 280.460 + 0.9856474 * n;
            const g = (357.528 + 0.9856003 * n) * RAD;
            const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD;
            const eps = (23.439 - 0.0000004 * n) * RAD;
            return { ra: Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)), dec: Math.asin(Math.sin(eps) * Math.sin(lam)), lon: lam };
        }

        function lunaEcuatorial(n) {
            const L = (218.316 + 13.176396 * n) * RAD;
            const M = (134.963 + 13.064993 * n) * RAD;
            const F = (93.272 + 13.229350 * n) * RAD;
            const lam = L + 6.289 * RAD * Math.sin(M);
            const beta = 5.128 * RAD * Math.sin(F);
            const eps = 23.439 * RAD;
            return {
                ra: Math.atan2(Math.sin(lam) * Math.cos(eps) - Math.tan(beta) * Math.sin(eps), Math.cos(lam)),
                dec: Math.asin(Math.sin(beta) * Math.cos(eps) + Math.cos(beta) * Math.sin(eps) * Math.sin(lam)),
                lon: lam
            };
        }

        function horizontales(ra, dec, lstGrados) {
            let H = lstGrados * RAD - ra;
            H = Math.atan2(Math.sin(H), Math.cos(H));
            const phi = CONFIG.latitud * RAD;
            const e = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
            const az = Math.atan2(-Math.sin(H) * Math.cos(dec), Math.cos(phi) * Math.sin(dec) - Math.sin(phi) * Math.cos(dec) * Math.cos(H));
            const eMax = 90 - Math.abs(CONFIG.latitud - dec * DEG);
            const Hs = Math.acos(clamp(-Math.tan(phi) * Math.tan(dec), -1, 1));
            return { e: e * DEG, az: ((az * DEG) + 360) % 360, H, Hs, eMax };
        }

        // ================================================================
        //  TRAYECTORIA EN PANTALLA
        //  La altura del astro en pantalla sale de su elevación real; la x
        //  lo pega a los laterales mientras está a media altura y solo cruza
        //  por arriba cerca del mediodía. Nunca entra en la zona central.
        // ================================================================
        function elevVisual(e, eMax) {
            if (e <= 0) return e;
            const s = Math.min(e / eMax, 1);
            return e + (CONFIG.gradosCima - eMax) * s * s * (3 - 2 * s);
        }

        function posicionPantalla(astro) {
            const ed = elevVisual(astro.e, astro.eMax);
            const s = ed / CONFIG.gradosCima;
            const y = CONFIG.horizonte + (CONFIG.cimaY - CONFIG.horizonte) * s;
            const q = Math.abs(astro.H) / Math.max(astro.Hs, 0.2);
            const u = Math.min(q / 0.62, 1);
            const f = u * u * (3 - 2 * u);
            const seguro = 0.30 * (1 - ss(0.70, 0.98, clamp(s, 0, 1)));   // mínimo de separación mientras está bajo
            let off = Math.max(CONFIG.margenX * f, seguro);
            if (q > 1) off = CONFIG.margenX + (q - 1) * 0.15;
            const lado = astro.H < 0 ? -1 : 1;                           // mañana a la izquierda
            return { x: 0.5 + lado * off, y, ed };
        }

        function dirPantalla(x, edGrados, aspecto) {
            const az = (x - 0.5) * aspecto * GRADOS_POR_Y * RAD, el = edGrados * RAD;
            return [Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)];
        }

        function dirLuz(astro) {
            // Luz sobre el paisaje: el lado (izquierda por la mañana, derecha por la tarde) y la
            // altura son los reales; la componente frontal se toma siempre hacia el espectador
            // para que las fachadas encaladas reciban el sol, como en las fotos desde San Nicolás.
            const rel = (astro.az - CONFIG.azimutCamara) * RAD, el = astro.e * RAD;
            return [Math.sin(rel) * Math.cos(el), Math.sin(el), Math.abs(Math.cos(rel)) * Math.cos(el) * 0.85];
        }

        // Matriz cámara → ecuatorial (para que las estrellas giren alrededor del polo)
        function matrizEcuatorial(lstGrados) {
            const A = CONFIG.azimutCamara * RAD, phi = CONFIG.latitud * RAD, L = lstGrados * RAD;
            const R = [Math.cos(A), -Math.sin(A), 0], U = [0, 0, 1], B = [-Math.sin(A), -Math.cos(A), 0];
            const XH = [0, -Math.sin(phi), Math.cos(phi)], YH = [-1, 0, 0], ZH = [0, Math.cos(phi), Math.sin(phi)];
            const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
            const cols = [R, U, B].map(c => {
                const cx = dot(c, XH), cy = dot(c, YH), cz = dot(c, ZH);
                return [Math.cos(L) * cx + Math.sin(L) * cy, Math.sin(L) * cx - Math.cos(L) * cy, cz];
            });
            return new Float32Array([...cols[0], ...cols[1], ...cols[2]]);  // column-major
        }

        // ================================================================
        //  ATMÓSFERA EN JS (misma física que el shader, para luces y exposición)
        // ================================================================
        const ATM = { Rp: 6371e3, Ra: 6471e3, bR: [5.8e-6, 13.5e-6, 33.1e-6], bM: 8e-6, bO: [0.65e-6, 1.881e-6, 0.085e-6], HR: 8000, HM: 1200, g: 0.80 };
        function rsi(o, d, r) {
            const b = 2 * (o[0] * d[0] + o[1] * d[1] + o[2] * d[2]);
            const c = o[0] * o[0] + o[1] * o[1] + o[2] * o[2] - r * r;
            const D = b * b - 4 * c;
            if (D < 0) return null;
            const s = Math.sqrt(D);
            return [(-b - s) / 2, (-b + s) / 2];
        }
        function profOptica(o, d, pasos) {
            const g = rsi(o, d, ATM.Rp);
            if (g && g[0] > 0) return null;
            const a = rsi(o, d, ATM.Ra);
            if (!a) return [0, 0, 0];
            const ds = a[1] / pasos;
            let r = 0, m = 0, z = 0;
            for (let i = 0; i < pasos; i++) {
                const t = (i + 0.5) * ds;
                const h = Math.hypot(o[0] + d[0] * t, o[1] + d[1] * t, o[2] + d[2] * t) - ATM.Rp;
                r += Math.exp(-h / ATM.HR); m += Math.exp(-h / ATM.HM); z += Math.max(0, 1 - Math.abs(h - 25e3) / 15e3);
            }
            return [r * ds, m * ds, z * ds];
        }
        function transmitancia(altura, eGrados) {
            const e = eGrados * RAD;
            const q = profOptica([0, ATM.Rp + altura, 0], [Math.cos(e), Math.sin(e), 0], 32);
            if (!q) return [0, 0, 0];
            return [0, 1, 2].map(i => Math.exp(-(ATM.bR[i] * q[0] + ATM.bM * 1.1 * q[1] + ATM.bO[i] * q[2])));
        }
        function cieloJS(rd, sd) {
            const o = [0, ATM.Rp + 800, 0];
            let L = rsi(o, rd, ATM.Ra)[1];
            const g = rsi(o, rd, ATM.Rp);
            if (g && g[0] > 0) L = Math.min(L, g[0]);
            const mu = rd[0] * sd[0] + rd[1] * sd[1] + rd[2] * sd[2], gg = ATM.g * ATM.g;
            const pR = 3 / (16 * Math.PI) * (1 + mu * mu);
            const pM = 3 / (8 * Math.PI) * ((1 - gg) * (mu * mu + 1)) / (Math.pow(1 + gg - 2 * mu * ATM.g, 1.5) * (2 + gg));
            const tR = [0, 0, 0], tM = [0, 0, 0];
            let oR = 0, oM = 0, oO = 0, prev = 0;
            for (let i = 0; i < 12; i++) {
                const f = (i + 1) / 12, t1 = L * f * f, ds = t1 - prev, tm = prev + ds / 2;
                prev = t1;
                const p = [o[0] + rd[0] * tm, o[1] + rd[1] * tm, o[2] + rd[2] * tm];
                const h = Math.hypot(p[0], p[1], p[2]) - ATM.Rp;
                const dR = Math.exp(-h / ATM.HR) * ds, dM = Math.exp(-h / ATM.HM) * ds;
                oR += dR; oM += dM; oO += Math.max(0, 1 - Math.abs(h - 25e3) / 15e3) * ds;
                const q = profOptica(p, sd, 5);
                if (!q) continue;
                for (let c = 0; c < 3; c++) {
                    const at = Math.exp(-(ATM.bR[c] * (oR + q[0]) + ATM.bM * 1.1 * (oM + q[1]) + ATM.bO[c] * (oO + q[2])));
                    tR[c] += dR * at; tM[c] += dM * at;
                }
            }
            return [0, 1, 2].map(c => 22 * (pR * ATM.bR[c] * tR[c] + pM * ATM.bM * tM[c]));
        }
        const DIRS_AMB = [[0, 1, 0]].concat([0, 1, 2, 3, 4, 5].map(k => {
            const a = k / 6 * 2 * Math.PI, el = 20 * RAD;
            return [Math.cos(a) * Math.cos(el), Math.sin(el), Math.sin(a) * Math.cos(el)];
        }));
        function ambienteCielo(eGrados) {
            const e = eGrados * RAD, sd = [Math.cos(e), Math.sin(e), 0], s = [0, 0, 0];
            for (const d of DIRS_AMB) { const v = cieloJS(d, sd); for (let c = 0; c < 3; c++) s[c] += v[c] / DIRS_AMB.length; }
            return s;
        }
        const acesJS = x => clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0, 1);

        // ================================================================
        //  RELIEVE EN JS (para saber cuándo el sol queda tras las montañas)
        // ================================================================
        function hash12(px, py) {
            let x = fract(px * 0.1031), y = fract(py * 0.1031), z = fract(px * 0.1031);
            const d = x * (y + 33.33) + y * (z + 33.33) + z * (x + 33.33);
            x += d; y += d; z += d;
            return fract((x + y) * z);
        }
        function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return mix(hash12(i, 1.7), hash12(i + 1, 1.7), u); }
        function fbm1(x) { let s = 0, a = 0.5; for (let i = 0; i < 4; i++) { s += a * noise1(x); x = x * 2.03 + 3.1; a *= 0.5; } return s; }
        const gauss = (x, c, w) => { const d = (x - c) / w; return Math.exp(-d * d); };
        const pico = (x, c, w, h) => h * Math.pow(Math.max(0, 1 - Math.abs(x - c) / w), 1.6);
        function sierraY(xv, panAsp) {
            const nx = xv * panAsp;
            const y = 0.207 + 0.010 * gauss(xv, 0.10, 0.08) + 0.006 * gauss(xv, 0.20, 0.05) + 0.010 * gauss(xv, 0.50, 0.16)
                + 0.018 * gauss(xv, 0.74, 0.11) + pico(xv, 0.62, 0.04, 0.008) + pico(xv, 0.69, 0.05, 0.016)
                + pico(xv, 0.785, 0.06, 0.030) + pico(xv, 0.845, 0.035, 0.022) - 0.006 * ss(0.88, 0.95, xv);
            let r = 0, a = 0.5, f = 5.0;
            for (let i = 0; i < 6; i++) { const n = noise1(nx * f + i * 7.3); r += a * (1 - Math.abs(2 * n - 1)); a *= 0.55; f *= 2.05; }
            return y + (r - 0.5) * (0.003 + 0.014 * ss(0, 0.03, y - 0.207));
        }
        function colinasY(xv, panAsp) {
            const nx = xv * panAsp;
            return 0.176 + 0.014 * gauss(xv, 0.60, 0.16) + 0.006 * gauss(xv, 0.08, 0.10) - 0.016 * ss(0.80, 0.98, xv)
                + (fbm1(nx * 2.6) - 0.5) * 0.012 + (noise1(nx * 30) - 0.5) * 0.0015;
        }

        // ================================================================
        //  PAISAJE PINTADO: Alhambra, Generalife, Albaicín y la ciudad
        //  Se pintan tres lienzos alineados:
        //    · albedo (color de la superficie)
        //    · emisivo (luces nocturnas)
        //    · info (R = distancia, G = orientación, B = tipo / id de ventana)
        //  El shader los ilumina con la luz real de cada momento.
        // ================================================================
        const TIPO = { muro: 0, tejado: 0.25, veg: 0.38 };
        const infoColor = (prof, cara, tipo) => `rgb(${Math.round(prof * 255)},${Math.round(cara * 255)},${Math.round(tipo * 255)})`;

        function mulberry32(seed) {
            let s = seed >>> 0;
            return () => {
                s = (s + 0x6D2B79F5) >>> 0;
                let t = s;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function curva(pts) {
            return x => {
                if (x <= pts[0][0]) return pts[0][1];
                for (let i = 0; i < pts.length - 1; i++) {
                    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
                    if (x <= x1) { const t = (x - x0) / (x1 - x0); return y0 + (y1 - y0) * (1 - Math.cos(t * Math.PI)) / 2; }
                }
                return pts[pts.length - 1][1];
            };
        }

        function tono(hex, k) {
            const [r, g, b] = hexARgb(hex);
            return `rgb(${clamp(Math.round(r * k), 0, 255)},${clamp(Math.round(g * k), 0, 255)},${clamp(Math.round(b * k), 0, 255)})`;
        }

        class Lienzo {
            constructor(w, h) {
                this.w = w; this.h = h;
                const crear = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
                this.alb = crear(); this.emi = crear(); this.inf = crear();
                this.cA = this.alb.getContext('2d');
                this.cE = this.emi.getContext('2d');
                this.cI = this.inf.getContext('2d');
                this.cE.fillStyle = '#000'; this.cE.fillRect(0, 0, w, h);
                this.cI.fillStyle = '#000'; this.cI.fillRect(0, 0, w, h);
            }
            // Rellena la misma forma en los tres lienzos
            forma(trazo, m) {
                const capas = [[this.cA, m.alb], [this.cE, m.emi || '#000'], [this.cI, infoColor(...m.inf)]];
                for (const [c, estilo] of capas) {
                    c.beginPath(); trazo(c);
                    c.fillStyle = typeof estilo === 'function' ? estilo(c) : estilo;
                    c.fill();
                }
                if (m.textura) this.texturar(trazo, m.textura, m.texturaAlfa ?? 0.5);
            }
            rect(x, y, w, h, m) { this.forma(c => c.rect(x, y, w, h), m); }
            poly(pts, m) { this.forma(c => { c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }, m); }
            // Superpone un patrón (tejas, piedra) solo en el albedo
            texturar(trazo, patron, alfa) {
                const c = this.cA;
                c.save(); c.beginPath(); trazo(c); c.clip();
                c.globalAlpha = alfa; c.fillStyle = patron; c.fillRect(0, 0, this.w, this.h);
                c.restore();
            }
            // Abre un hueco (arco de campanario) solo en el albedo
            hueco(trazo) {
                const c = this.cA;
                c.save(); c.globalCompositeOperation = 'destination-out'; c.beginPath(); trazo(c); c.fill(); c.restore();
            }
            // Muchas copas de árbol de una vez (agrupadas por color)
            copas(lista, prof) {
                const porColor = new Map();
                for (const b of lista) { if (!porColor.has(b.c)) porColor.set(b.c, []); porColor.get(b.c).push(b); }
                const trazarTodas = (c, arr) => { c.beginPath(); for (const b of arr) { c.moveTo(b.x + b.r, b.y); c.arc(b.x, b.y, b.r, 0, Math.PI * 2); } };
                trazarTodas(this.cE, lista); this.cE.fillStyle = '#000'; this.cE.fill();
                trazarTodas(this.cI, lista); this.cI.fillStyle = infoColor(prof, 0.5, TIPO.veg); this.cI.fill();
                for (const [color, arr] of porColor) { trazarTodas(this.cA, arr); this.cA.fillStyle = color; this.cA.fill(); }
            }
        }

        function patrones(L, u) {
            const crearPatron = (w, h, dibujar) => {
                const c = document.createElement('canvas');
                c.width = Math.max(2, Math.round(w)); c.height = Math.max(2, Math.round(h));
                dibujar(c.getContext('2d'), c.width, c.height);
                return L.cA.createPattern(c, 'repeat');
            };
            const rnd = mulberry32(77);
            // Teja árabe: canales verticales con hiladas y algún liquen
            const teja = crearPatron(Math.max(4, u * 2.6) * 8, Math.max(4, u * 3.4) * 6, (c, w, h) => {
                const cw = w / 8, ch = h / 6;
                for (let i = 0; i < 8; i++) {
                    c.fillStyle = i % 2 ? 'rgba(60,20,8,0.55)' : 'rgba(255,205,170,0.22)';
                    c.fillRect(i * cw, 0, cw * 0.55, h);
                }
                c.fillStyle = 'rgba(40,12,5,0.35)';
                for (let j = 0; j < 6; j++) c.fillRect(0, j * ch, w, Math.max(1, ch * 0.16));
                for (let k = 0; k < 10; k++) { c.fillStyle = `rgba(${90 + rnd() * 60},${80 + rnd() * 40},50,${0.25 + rnd() * 0.3})`; c.fillRect(rnd() * w, rnd() * h, cw * 0.6, ch * 0.5); }
            });
            // Piedra: sillares e hiladas sutiles
            const piedra = crearPatron(Math.max(8, u * 26), Math.max(8, u * 20), (c, w, h) => {
                for (let k = 0; k < 140; k++) {
                    const v = rnd();
                    c.fillStyle = v < 0.5 ? `rgba(60,25,12,${0.08 + rnd() * 0.18})` : `rgba(255,220,190,${0.06 + rnd() * 0.12})`;
                    c.fillRect(rnd() * w, rnd() * h, 1 + rnd() * u * 1.6, 1 + rnd() * u * 0.9);
                }
                c.fillStyle = 'rgba(50,20,10,0.16)';
                for (let j = 0; j < 4; j++) c.fillRect(0, j * h / 4, w, Math.max(1, u * 0.35));
            });
            // Cal: manchas suaves de humedad y desconchones
            const cal = crearPatron(Math.max(8, u * 30), Math.max(8, u * 30), (c, w, h) => {
                for (let k = 0; k < 40; k++) {
                    c.fillStyle = `rgba(120,100,80,${0.04 + rnd() * 0.08})`;
                    c.beginPath(); c.ellipse(rnd() * w, rnd() * h, 1 + rnd() * u * 3, 1 + rnd() * u * 1.5, 0, 0, Math.PI * 2); c.fill();
                }
            });
            return { teja, piedra, cal };
        }

        // Paleta de hoja caduca según la estación: [sombra, medio, luz]
        function paletaCaduca(doy) {
            if (doy >= 285 && doy < 340) {   // otoño: olmos y álamos dorados, apagados por la distancia
                const t = ss(285, 315, doy);
                return t < 0.5
                    ? [['#323419', '#3a3b1b'], ['#4c4a21', '#565224'], ['#6a632b', '#736a2e']]
                    : [['#3d3418', '#45391a'], ['#5e4f20', '#6a5823'], ['#7d6a2c', '#86722f']];
            }
            if (doy >= 340 || doy < 75) return [['#3a342c', '#40392f'], ['#4f463a', '#574d40'], ['#655a4b', '#6d6150']];
            if (doy < 135) return [['#2a3a1c', '#2f411f'], ['#41592a', '#4a632e'], ['#5f7c38', '#6a873e']];
            return [['#1f2b18', '#22301a'], ['#2f3f22', '#344626'], ['#435733', '#4a5f37']];
        }

        function pintarPaisaje(cssW, cssH, dpr, doy) {
            const band = CONFIG.banda;
            const W = Math.max(2, Math.round(cssW * dpr));
            const Hs = Math.max(2, Math.round(cssH * dpr));
            const H = Math.max(2, Math.round(Hs * band));
            const L = new Lienzo(W, H);
            const Wv = Math.max(W, 1.6 * Hs);
            const off = (Wv - W) / 2;
            const X = xv => xv * Wv - off;
            const Y = y => (band - y) * Hs;
            const S = v => v * Hs;
            const u = Hs / 1000;                       // unidad de detalle (1 px a 1000 px de alto)
            const pix = v => Math.round(v);
            const PAT = patrones(L, Math.max(1, u * 1.2));
            const pick = (arr, r) => arr[Math.floor(r() * arr.length)];

            const PIEDRA = ['#b06a48', '#a8623f', '#b8734f', '#a05d3d'];
            const CAL = ['#eee8dc', '#f2ede4', '#e9e1d1', '#efe6d3', '#e7e2da', '#ebdcc4', '#f0e2c8'];
            const TEJA = ['#9c5a3c', '#8e5236', '#a4644a', '#87503a', '#a06048', '#93604a'];
            const CIPRES = ['#1b291c', '#1f2f20', '#223322', '#19261a'];
            const VERDE = ['#26381f', '#2c4024', '#22331c', '#31462a', '#1f2e1a'];

            // Luz de los focos de la Alhambra: dorada abajo, más tenue arriba
            const foco = (yb, yt, k = 1) => c => {
                const g = c.createLinearGradient(0, yb, 0, yt);
                g.addColorStop(0, `rgb(${Math.round(240 * k)},${Math.round(146 * k)},${Math.round(70 * k)})`);
                g.addColorStop(1, `rgb(${Math.round(128 * k)},${Math.round(68 * k)},${Math.round(30 * k)})`);
                return g;
            };

            // ------------------------------------------------------------
            // 1. Colina de la Sabika (base)
            // ------------------------------------------------------------
            const cresta = curva([[-0.06, 0.110], [0.03, 0.122], [0.09, 0.134], [0.16, 0.143], [0.26, 0.147], [0.36, 0.149],
            [0.46, 0.151], [0.54, 0.153], [0.60, 0.158], [0.66, 0.167], [0.72, 0.175], [0.78, 0.178], [0.84, 0.170],
            [0.90, 0.155], [0.96, 0.140], [1.06, 0.128]]);
            {
                const pts = [];
                for (let x = -0.08; x <= 1.08; x += 0.004) pts.push([X(x), Y(cresta(x))]);
                pts.push([X(1.08), Y(-0.01)], [X(-0.08), Y(-0.01)]);
                L.poly(pts, { alb: '#22301c', inf: [0.45, 0.5, TIPO.veg] });
            }

            // ------------------------------------------------------------
            // 2. Alhambra
            // ------------------------------------------------------------
            const rA = mulberry32(1492);
            const PROF_A = 0.40;

            const almenas = (x0, x1, yTop, tipo = 'cuadrada') => {
                const paso = S(0.0056), ancho = S(0.003), alto = S(tipo === 'pico' ? 0.0046 : 0.0032);
                for (let x = x0 + paso * 0.3; x + ancho <= x1; x += paso) {
                    if (tipo === 'pico') L.poly([[x, yTop], [x + ancho, yTop], [x + ancho / 2, yTop - alto]], { alb: pick(PIEDRA, rA), emi: foco(yTop + alto * 4, yTop - alto, 0.55), inf: [PROF_A, 0.5, TIPO.muro] });
                    else L.rect(x, yTop - alto, ancho, alto, { alb: pick(PIEDRA, rA), emi: foco(yTop + alto * 4, yTop - alto, 0.55), inf: [PROF_A, 0.5, TIPO.muro] });
                }
            };

            const ventanaArco = (xc, yb, w, h, prof, luz = null) => {
                L.forma(c => { c.rect(xc - w / 2, yb - h + w / 2, w, h - w / 2); c.moveTo(xc + w / 2, yb - h + w / 2); c.arc(xc, yb - h + w / 2, w / 2, 0, Math.PI, true); },
                    { alb: '#2f1d16', emi: luz || '#000', inf: [prof, 0.5, TIPO.muro] });
            };

            const torre = o => {
                const base = cresta(o.x) - 0.010;
                const xc = X(o.x), w = S(o.w);
                const x0 = xc - w / 2, x1 = xc + w / 2;
                const yb = Y(base), yt = Y(cresta(o.x) + o.h);
                const col = o.color || pick(PIEDRA, rA);
                const prof = o.prof ?? PROF_A;
                const conFoco = o.foco !== false;
                if (o.lado) {
                    const sw = w * 0.26;
                    const pts = o.lado < 0 ? [[x0, yb], [x0, yt], [x0 - sw, yt + sw * 0.18], [x0 - sw, yb]]
                        : [[x1, yb], [x1, yt], [x1 + sw, yt + sw * 0.18], [x1 + sw, yb]];
                    L.poly(pts, { alb: tono(col, 0.94), emi: conFoco ? foco(yb, yt, 0.6) : null, inf: [prof, o.lado < 0 ? 0.12 : 0.88, TIPO.muro], textura: PAT.piedra, texturaAlfa: 0.6 });
                }
                L.rect(x0, yt, w, yb - yt, { alb: col, emi: conFoco ? foco(yb, yt) : null, inf: [prof, 0.5, TIPO.muro], textura: o.cal ? PAT.cal : PAT.piedra, texturaAlfa: 0.6 });
                if (o.almenas) almenas(x0, x1, yt, o.almenas);
                if (o.techo) {
                    const th = S(o.techo);
                    L.poly([[x0 - u, yt], [x1 + u, yt], [xc, yt - th]], { alb: pick(TEJA, rA), inf: [prof, 0.5, TIPO.tejado], textura: PAT.teja, texturaAlfa: 0.45 });
                }
                for (let i = 0; i < (o.ventanas || 0); i++) {
                    const vx = x0 + w * (i + 1) / ((o.ventanas || 0) + 1);
                    ventanaArco(vx, yt + (yb - yt) * 0.32, S(0.0034), S(0.0068), prof);
                }
                return { x0, x1, yt, yb, xc, w };
            };

            const muralla = (xa, xb, alto, conAlmenas = true) => {
                const pts = [];
                for (let x = xa; x <= xb + 1e-9; x += 0.003) pts.push([X(x), Y(cresta(x) + alto)]);
                for (let x = xb; x >= xa - 1e-9; x -= 0.003) pts.push([X(x), Y(cresta(x) - 0.012)]);
                const yb = Y(cresta(xa) - 0.012), yt = Y(cresta(xa) + alto);
                L.poly(pts, { alb: pick(PIEDRA, rA), emi: foco(yb, yt, 0.9), inf: [PROF_A, 0.5, TIPO.muro], textura: PAT.piedra, texturaAlfa: 0.6 });
                if (conAlmenas) {
                    const paso = S(0.0056), ancho = S(0.003), aM = S(0.0032);
                    for (let px = X(xa) + paso * 0.4; px < X(xb) - ancho; px += paso) {
                        const xvLocal = (px + off) / Wv;
                        const yTop = Y(cresta(xvLocal) + alto);
                        L.rect(px, yTop - aM, ancho, aM + 1, { alb: pick(PIEDRA, rA), emi: foco(yTop + aM * 3, yTop - aM, 0.5), inf: [PROF_A, 0.5, TIPO.muro] });
                    }
                }
            };

            const tejado = (x0, x1, yt, alto, prof, voladizo = 0) => {
                const t = S(alto), v = S(voladizo);
                L.poly([[x0 - v, yt], [x1 + v, yt], [x1 - t * 1.6, yt - t], [x0 + t * 1.6, yt - t]],
                    { alb: pick(TEJA, rA), inf: [prof, 0.5, TIPO.tejado], textura: PAT.teja, texturaAlfa: 0.5 });
            };

            // Palacio de Carlos V (detrás de la muralla)
            {
                const xc = X(0.205), w = S(0.072), yb = Y(cresta(0.205) - 0.004), yt = Y(cresta(0.205) + 0.036);
                L.rect(xc - w / 2, yt, w, yb - yt, { alb: '#c39272', emi: foco(yb, yt, 0.7), inf: [0.41, 0.5, TIPO.muro], textura: PAT.piedra, texturaAlfa: 0.45 });
                for (let f = 0; f < 2; f++) for (let i = 0; i < 9; i++) {
                    const vx = pix(xc - w / 2 + w * (i + 0.6) / 9.2), vy = pix(yt + (yb - yt) * (0.22 + f * 0.32));
                    L.rect(vx, vy, Math.max(1, pix(S(0.0026))), Math.max(2, pix(S(0.0055))), { alb: '#3a2a22', inf: [0.41, 0.5, TIPO.muro] });
                }
                tejado(xc - w / 2, xc + w / 2, yt, 0.006, 0.41, 0.0012);
            }
            // Iglesia de Santa María de la Alhambra
            torre({ x: 0.300, w: 0.013, h: 0.050, techo: 0.010, lado: 1, color: '#c08b68', cal: true });
            // Palacios Nazaríes: cubiertas de teja
            for (const [x, w, h] of [[0.288, 0.034, 0.030], [0.322, 0.030, 0.026]]) {
                const xc = X(x), ww = S(w), yb = Y(cresta(x) - 0.006), yt = Y(cresta(x) + h);
                L.rect(xc - ww / 2, yt, ww, yb - yt, { alb: pick(PIEDRA, rA), emi: foco(yb, yt, 0.8), inf: [PROF_A, 0.5, TIPO.muro], textura: PAT.piedra, texturaAlfa: 0.55 });
                tejado(xc - ww / 2, xc + ww / 2, yt, 0.007, PROF_A, 0.001);
            }

            // Murallas
            muralla(0.072, 0.178, 0.022);
            muralla(0.172, 0.562, 0.016);

            // Torres de la Alcazaba
            const vela = torre({ x: 0.094, w: 0.034, h: 0.050, almenas: 'cuadrada', lado: -1, ventanas: 2 });
            {   // espadaña con la campana de la Vela
                const ew = S(0.011), eh = S(0.012), ex = vela.xc + S(0.004);
                L.rect(ex - ew / 2, vela.yt - eh - S(0.0032), ew, eh, { alb: '#c48a6a', emi: foco(vela.yt, vela.yt - eh, 0.75), inf: [PROF_A, 0.5, TIPO.muro] });
                L.hueco(c => { const aw = ew * 0.5, ab = vela.yt - S(0.0032) - eh * 0.18; c.rect(ex - aw / 2, ab - eh * 0.45, aw, eh * 0.45); c.moveTo(ex + aw / 2, ab - eh * 0.45); c.arc(ex, ab - eh * 0.45, aw / 2, 0, Math.PI, true); });
                L.poly([[ex - ew * 0.16, vela.yt - S(0.0032) - eh * 0.25], [ex + ew * 0.16, vela.yt - S(0.0032) - eh * 0.25], [ex + ew * 0.12, vela.yt - S(0.0032) - eh * 0.6], [ex - ew * 0.12, vela.yt - S(0.0032) - eh * 0.6]],
                    { alb: '#4a3a22', inf: [PROF_A, 0.5, TIPO.muro] });
            }
            torre({ x: 0.128, w: 0.020, h: 0.036, almenas: 'cuadrada' });
            torre({ x: 0.160, w: 0.025, h: 0.054, almenas: 'cuadrada', lado: -1, ventanas: 1 });
            // Torre de Comares
            torre({ x: 0.258, w: 0.046, h: 0.060, almenas: 'cuadrada', lado: -1, ventanas: 3 });
            // Torre de las Damas con su pórtico
            {
                const d = torre({ x: 0.356, w: 0.030, h: 0.034, almenas: 'cuadrada', lado: -1 });
                const n = 5, aw = d.w / (n + 1.2);
                for (let i = 0; i < n; i++) ventanaArco(d.x0 + d.w * (i + 0.85) / (n + 0.7), d.yb - (d.yb - d.yt) * 0.14, aw * 0.72, (d.yb - d.yt) * 0.36, PROF_A, 'rgb(255,190,110)');
            }
            torre({ x: 0.386, w: 0.012, h: 0.022, almenas: 'cuadrada' });
            torre({ x: 0.425, w: 0.024, h: 0.042, almenas: 'pico', lado: 1, ventanas: 1 });   // Torre de los Picos
            torre({ x: 0.462, w: 0.018, h: 0.030, almenas: 'cuadrada' });                    // la Cautiva
            torre({ x: 0.498, w: 0.022, h: 0.034, almenas: 'cuadrada', lado: 1, ventanas: 1 }); // las Infantas
            torre({ x: 0.533, w: 0.015, h: 0.024, almenas: 'cuadrada' });

            // ------------------------------------------------------------
            // 3. Generalife y sus cipreses
            // ------------------------------------------------------------
            {
                const rG = mulberry32(1319);
                const cip = [];
                for (let x = 0.585; x < 0.765; x += 0.0045 + rG() * 0.004) cip.push([x, 0.018 + rG() * 0.026]);
                const cipres = (xc, yb, alto, ancho, prof, color) => {
                    L.forma(c => {
                        c.moveTo(xc - ancho / 2, yb);
                        c.quadraticCurveTo(xc - ancho * 0.62, yb - alto * 0.45, xc, yb - alto);
                        c.quadraticCurveTo(xc + ancho * 0.62, yb - alto * 0.45, xc + ancho / 2, yb);
                        c.closePath();
                    }, { alb: color, inf: [prof, 0.5, TIPO.veg] });
                };
                for (const [x, h] of cip.filter((_, i) => i % 2)) cipres(X(x), Y(cresta(x) - 0.004), S(h), S(0.0062), 0.47, pick(CIPRES, rG));
                const xc = X(0.672), w = S(0.072), yb = Y(cresta(0.672) - 0.002), yt = Y(cresta(0.672) + 0.017);
                L.rect(xc - w / 2, yt, w, yb - yt, { alb: '#ebe2d2', emi: foco(yb, yt, 0.45), inf: [0.46, 0.5, TIPO.muro], textura: PAT.cal, texturaAlfa: 0.6 });
                for (let i = 0; i < 9; i++) ventanaArco(xc - w / 2 + w * (i + 0.7) / 9.4, yb - (yb - yt) * 0.12, S(0.0042), (yb - yt) * 0.5, 0.46, 'rgb(150,95,50)');
                tejado(xc - w / 2, xc + w / 2, yt, 0.005, 0.46, 0.001);
                const t = torre({ x: 0.708, w: 0.013, h: 0.032, techo: 0.008, color: '#e8dece', cal: true, prof: 0.46 });
                ventanaArco(t.xc, t.yt + (t.yb - t.yt) * 0.35, S(0.004), S(0.008), 0.46, 'rgb(150,95,50)');
                for (const [x, h] of cip.filter((_, i) => !(i % 2))) cipres(X(x), Y(cresta(x) - 0.006), S(h * 0.9), S(0.0058), 0.45, pick(CIPRES, rG));
            }

            // ------------------------------------------------------------
            // Vegetación: cada copa es un racimo de hojas (sombra abajo, luz arriba)
            // ------------------------------------------------------------
            const PAL_PERENNE = [['#17211a', '#1a2517', '#1d2919'], ['#24311d', '#28361f', '#2c3b22'], ['#36482a', '#3b4e2d', '#415532']];
            const PAL_CADUCA = paletaCaduca(doy);
            const racimo = (lista, cx, cy, R, rnd, caduco = false, n = 7) => {
                const pal = caduco ? PAL_CADUCA : PAL_PERENNE;
                for (let k = 0; k < n; k++) {
                    const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * R * 0.75;
                    const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * 0.85;
                    const alto = (cy - y) / R;
                    const nivel = alto > 0.18 ? 2 : alto < -0.22 ? 0 : 1;
                    lista.push({ x, y, r: R * (0.30 + rnd() * 0.28), c: pick(pal[nivel], rnd), n: nivel });
                }
            };
            const plantarCopas = (lista, prof) => {
                // De atrás hacia delante por franjas; dentro de cada franja, de oscuro a claro
                const alto = Math.max(4, S(0.012));
                const franjas = new Map();
                for (const b of lista) { const k = Math.floor(b.y / alto); if (!franjas.has(k)) franjas.set(k, []); franjas.get(k).push(b); }
                for (const k of [...franjas.keys()].sort((p, q) => p - q)) L.copas(franjas.get(k).sort((p, q) => p.n - q.n), prof);
            };

            // ------------------------------------------------------------
            // 4. Bosque de la Alhambra (cubre la base de las murallas)
            // ------------------------------------------------------------
            {
                const rB = mulberry32(711);
                const lista = [];
                for (let x = -0.06; x < 1.07; x += 0.0045 + rB() * 0.004) {
                    const conMuralla = x > 0.06 && x < 0.57;
                    const techo = cresta(x) + (conMuralla ? -0.009 : x >= 0.57 && x < 0.78 ? -0.005 : 0.003);
                    for (let y = techo; y > 0.07; y -= 0.005 + rB() * 0.004) {
                        const R = S(0.0042 + rB() * 0.004);
                        racimo(lista, X(x) + (rB() - 0.5) * S(0.004), Y(y) + R * 0.5, R, rB, rB() < 0.10);
                    }
                }
                plantarCopas(lista, 0.42);
            }

            // ------------------------------------------------------------
            // 5. La ciudad al pie de la colina (Realejo y Centro) con la Catedral
            // ------------------------------------------------------------
            {
                const rC = mulberry32(1526);
                const PROF_C = 0.56;
                const luces = ['rgb(255,176,102)', 'rgb(255,198,138)', 'rgb(255,226,186)', 'rgb(220,232,255)', 'rgb(255,160,80)'];
                let x = 0.735;
                while (x < 1.07) {
                    const w = 0.005 + rC() * 0.011, h = 0.006 + rC() * 0.016;
                    const base = 0.086 + rC() * 0.01;
                    const x0 = pix(X(x)), x1 = pix(X(x + w * 1.6 * Hs / Wv));
                    const yb = pix(Y(base)), yt = pix(Y(base + h));
                    L.rect(x0, yt, x1 - x0, yb - yt, { alb: pick(['#d9cbb4', '#cdb79a', '#e2d6c2', '#bfa98d', '#d6c3a5'], rC), inf: [PROF_C, 0.5, TIPO.muro] });
                    L.rect(x0, yt - Math.max(1, pix(u * 1.2)), x1 - x0, Math.max(1, pix(u * 1.2)), { alb: pick(TEJA, rC), inf: [PROF_C, 0.5, TIPO.tejado] });
                    const vw = Math.max(1, pix(u * 1.3)), vh = Math.max(1, pix(u * 1.8));
                    for (let vy = yt + vh * 1.6; vy < yb - vh; vy += vh * 2.6)
                        for (let vx = x0 + vw; vx < x1 - vw; vx += vw * 2.8)
                            if (rC() < 0.55) L.rect(vx, vy, vw, vh, { alb: '#2b2622', emi: pick(luces, rC), inf: [PROF_C, 0.5, 0.5 + 0.5 * (0.02 + rC() * 0.98)] });
                    x += w * 1.6 * Hs / Wv * (0.75 + rC() * 0.3);
                }
                // Farolas de las calles: puntos de sodio
                for (let k = 0; k < 70; k++) {
                    const lx = pix(X(0.74 + rC() * 0.33)), ly = pix(Y(0.084 + rC() * 0.012)), r = Math.max(1, pix(u * 1.1));
                    L.rect(lx, ly, r, r, { alb: '#3a3128', emi: 'rgb(255,190,110)', inf: [PROF_C, 0.5, TIPO.muro] });
                }
                // Catedral de Granada
                const cx = X(0.872), cw = S(0.05), cb = Y(0.090), ct = Y(0.118);
                L.rect(cx - cw / 2, ct, cw, cb - ct, { alb: '#d8c7a6', emi: foco(cb, ct, 0.85), inf: [0.54, 0.5, TIPO.muro], textura: PAT.piedra, texturaAlfa: 0.35 });
                L.forma(c => { c.ellipse(cx + cw * 0.12, ct, S(0.011), S(0.010), 0, Math.PI, 0); c.closePath(); },
                    { alb: '#7a8a86', emi: foco(ct, ct - S(0.01), 0.35), inf: [0.54, 0.5, TIPO.tejado] });
                const tx = cx - cw * 0.36, tw = S(0.011);
                L.rect(tx - tw / 2, Y(0.140), tw, Y(0.118) - Y(0.140) + 1, { alb: '#d6c4a2', emi: foco(Y(0.118), Y(0.14), 0.9), inf: [0.54, 0.5, TIPO.muro] });
                L.rect(tx - tw * 0.35, Y(0.147), tw * 0.7, Y(0.140) - Y(0.147) + 1, { alb: '#d6c4a2', emi: foco(Y(0.14), Y(0.147), 0.8), inf: [0.54, 0.5, TIPO.muro] });
                for (let i = 0; i < 3; i++) ventanaArco(tx, Y(0.128 + i * 0.006), S(0.0028), S(0.004), 0.54, 'rgb(255,190,120)');
            }

            // ------------------------------------------------------------
            // 6. Valle del Darro: olmos, almeces y álamos
            // ------------------------------------------------------------
            {
                const rV = mulberry32(1238);
                const lista = [];
                for (let x = -0.06; x < 1.07; x += 0.004 + rV() * 0.005) {
                    const top = 0.097 + 0.009 * Math.sin(x * 9.0 + 1.3) + rV() * 0.01;
                    for (let y = top; y > 0.062; y -= 0.0055 + rV() * 0.004) {
                        const R = S(0.0045 + rV() * 0.0045);
                        racimo(lista, X(x), Y(y) + R * 0.4, R, rV, rV() < 0.2);
                    }
                }
                plantarCopas(lista, 0.30);
                const alamos = [];
                for (let k = 0; k < 30; k++) {
                    const x = rV() * 1.1 - 0.05, yb = 0.07 + rV() * 0.02, h = 0.028 + rV() * 0.024, w = 0.0035 + rV() * 0.002;
                    for (let j = 0; j < 9; j++) {
                        const t = j / 8, R = S(w) * (1 - 0.6 * Math.abs(t - 0.4));
                        racimo(alamos, X(x) + (rV() - 0.5) * S(0.002), Y(yb + h * t), R, rV, true, 3);
                    }
                }
                plantarCopas(alamos, 0.30);
            }

            // ------------------------------------------------------------
            // 7. El Albaicín: casas encaladas, tejas, ventanas, buganvillas y faroles
            // ------------------------------------------------------------
            const rH = mulberry32(1013);
            const LUZ_VENTANA = ['rgb(255,178,104)', 'rgb(255,196,132)', 'rgb(255,164,86)', 'rgb(255,214,168)', 'rgb(255,232,200)'];
            const BUGANVILLA = ['#9c2358', '#b0306a', '#8a1f4e', '#c04780'];
            const floreceBuganvilla = doy > 100 && doy < 330;

            const ventana = (x, y, w, h, prof) => {
                x = pix(x); y = pix(y); w = Math.max(2, pix(w)); h = Math.max(2, pix(h));
                const id = 0.02 + rH() * 0.98;
                if (rH() < 0.3) {   // contraventanas
                    const pc = pick(['#4f6a4b', '#5a4636', '#3e5a55', '#6b5a3c'], rH);
                    const pw = Math.max(1, Math.ceil(w * 0.42));
                    L.rect(x - pw, y, pw, h, { alb: pc, inf: [prof, 0.5, TIPO.muro] });
                    L.rect(x + w, y, pw, h, { alb: pc, inf: [prof, 0.5, TIPO.muro] });
                }
                L.rect(x, y, w, h, { alb: '#241e1a', emi: pick(LUZ_VENTANA, rH), inf: [prof, 0.5, 0.5 + 0.5 * id] });
                L.rect(x, y, w, 1, { alb: '#1a1512', inf: [prof, 0.5, TIPO.muro] });   // dintel en sombra

            };

            const farol = (x, y, prof) => {
