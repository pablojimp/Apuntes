            };

            const sombraFachada = (xa, yt, w, h) => {   // oclusión bajo el alero y junto al suelo
                const c = L.cA, g = c.createLinearGradient(0, yt, 0, yt + h);
                g.addColorStop(0, 'rgba(48,34,24,0.45)');
                g.addColorStop(clamp(S(0.004) / h, 0.05, 0.3), 'rgba(48,34,24,0)');
                g.addColorStop(0.68, 'rgba(40,30,22,0)');
                g.addColorStop(1, 'rgba(40,30,22,0.30)');
                c.fillStyle = g; c.fillRect(xa, yt, w, h);
            };

            const cipres = (x, base, alto, ancho, prof) => {
                const xc = X(x), yb = Y(base), h = S(alto), w = S(ancho);
                const trazo = c => {
                    c.moveTo(xc - w / 2, yb);

                    c.quadraticCurveTo(xc + w * 0.66, yb - h * 0.42, xc + w / 2, yb);
                    c.closePath();
                };
                L.forma(trazo, { alb: pick(CIPRES, rH), inf: [prof, 0.5, TIPO.veg] });

                const c = L.cA;
                c.save(); c.beginPath(); trazo(c); c.clip();
                const g = c.createLinearGradient(xc - w / 2, 0, xc + w / 2, 0);
                g.addColorStop(0, 'rgba(90,120,80,0.10)'); g.addColorStop(0.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.25)');
                c.fillStyle = g; c.fillRect(xc - w, yb - h, w * 2, h);
                c.restore();
            };

            const casa = (x0, base, w, h, prof, o = {}) => {
                const xa = pix(X(x0)), xb = pix(X(x0) + S(w)), yb = pix(Y(base)), yt = pix(Y(base + h));
                const ww = xb - xa, hh = yb - yt;
                if (ww < 3 || hh < 3) return;
                const col = pick(CAL, rH);
                const lado = rH() < 0.5 ? (rH() < 0.5 ? -1 : 1) : 0;
                if (lado) {
                    const sw = ww * (0.12 + rH() * 0.12);

                    L.poly(pts, { alb: tono(col, 0.96), inf: [prof, lado < 0 ? 0.15 : 0.85, TIPO.muro], textura: PAT.cal, texturaAlfa: 0.8 });

                }

                { base: 0.038, dB: 0.007, h: [0.015, 0.026], w: [0.016, 0.032], prof: 0.17 },
                { base: 0.018, dB: 0.008, h: [0.019, 0.032], w: [0.021, 0.042], prof: 0.12, puerta: true },

            ];

                    else casa(x, base, w, h, f.prof, f);

            // Campanario a la izquierda (ladrillo y cuerpo de campanas)
            {
                const xc = X(0.040), w = S(0.032), yb = Y(-0.01), yt = Y(0.112), prof = 0.08;
                L.rect(xc - w / 2, yt, w, yb - yt, { alb: '#a9654b', emi: foco(yb, yt, 0.55), inf: [prof, 0.5, TIPO.muro], textura: PAT.piedra, texturaAlfa: 0.7 });
                L.poly([[xc + w / 2, yt], [xc + w / 2 + S(0.007), yt + S(0.002)], [xc + w / 2 + S(0.007), yb], [xc + w / 2, yb]],
                    { alb: '#9f5d45', inf: [prof, 0.86, TIPO.muro], textura: PAT.piedra, texturaAlfa: 0.7 });
                for (let k = 0; k < 6; k++) L.rect(xc - w / 2, Y(0.02 + k * 0.016), w + S(0.007), Math.max(1, pix(u * 1.2)), { alb: '#8a4e3a', inf: [prof, 0.5, TIPO.muro] });
                L.rect(xc - w / 2 - S(0.0015), yt + S(0.0045), w + S(0.003), Math.max(1, pix(S(0.0018))), { alb: '#b87459', inf: [prof, 0.5, TIPO.muro] });
                for (const k of [-0.3, 0, 0.3]) {
                    const ax = xc + w * k, aw = w * 0.17, atop = yt + S(0.0075), ah = S(0.016);
                    L.forma(c => { c.rect(ax - aw / 2, atop + aw / 2, aw, ah - aw / 2); c.moveTo(ax + aw / 2, atop + aw / 2); c.arc(ax, atop + aw / 2, aw / 2, 0, Math.PI, true); },
                        { alb: '#21170f', emi: 'rgb(70,42,22)', inf: [prof, 0.5, TIPO.muro] });
                    if (k !== 0) L.rect(ax - aw * 0.22, atop + ah * 0.42, aw * 0.44, ah * 0.32, { alb: '#5d4a2b', inf: [prof, 0.5, TIPO.muro] });
                }
                L.poly([[xc - w / 2 - S(0.002), yt], [xc + w / 2 + S(0.002), yt], [xc, yt - S(0.016)]], { alb: '#a35835', inf: [prof, 0.5, TIPO.tejado], textura: PAT.teja, texturaAlfa: 0.5 });
                L.rect(xc - 1, yt - S(0.026), Math.max(2, pix(u * 1.6)), S(0.011), { alb: '#2a2420', inf: [prof, 0.5, TIPO.muro] });
                L.rect(xc - S(0.003), yt - S(0.022), S(0.006) + 2, Math.max(2, pix(u * 1.6)), { alb: '#2a2420', inf: [prof, 0.5, TIPO.muro] });
            }
            // Cipreses que enmarcan la izquierda
            cipres(0.078, -0.01, 0.15, 0.016, 0.06);
            cipres(0.094, -0.01, 0.118, 0.013, 0.07);

            // Palmera y ciprés a la derecha
            {
                cipres(0.925, -0.01, 0.13, 0.014, 0.06);
                const tx = X(0.958), tb = Y(-0.01), th = S(0.15), prof = 0.06;
                const cima = [tx + S(0.012), tb - th];
                L.forma(c => {
                    c.moveTo(tx - S(0.0028), tb);
                    c.quadraticCurveTo(tx + S(0.004), tb - th * 0.5, cima[0] - S(0.0016), cima[1]);
                    c.lineTo(cima[0] + S(0.0016), cima[1]);
                    c.quadraticCurveTo(tx + S(0.008), tb - th * 0.5, tx + S(0.0028), tb);
                    c.closePath();
                }, { alb: '#5d4a37', inf: [prof, 0.5, TIPO.muro] });
                for (let k = 0; k < 13; k++) {
                    const a = -Math.PI * 0.95 + k / 12 * Math.PI * 1.1 + (rH() - 0.5) * 0.2;
                    const len = S(0.036 + rH() * 0.014);
                    const ex = cima[0] + Math.cos(a) * len, ey = cima[1] + Math.sin(a) * len * 0.75 + len * 0.35;
                    const mx = cima[0] + Math.cos(a) * len * 0.5, my = cima[1] + Math.sin(a) * len * 0.5 - len * 0.12;
                    L.forma(c => {
                        c.moveTo(cima[0], cima[1]);
                        c.quadraticCurveTo(mx, my - S(0.003), ex, ey);
                        c.quadraticCurveTo(mx, my + S(0.003), cima[0], cima[1] + S(0.002));
                        c.closePath();
                    }, { alb: pick(['#2f4a26', '#365429', '#2a4122'], rH), inf: [prof, 0.5, TIPO.veg] });
                }
            }

            // Altura del paisaje en cada columna (para saber cuándo el sol se oculta)
            const datos = L.cA.getImageData(0, 0, W, H).data;
            const cimaColumna = new Float32Array(W);
            for (let x = 0; x < W; x++) {
                let fila = H;
                for (let y = 0; y < H; y++) if (datos[(y * W + x) * 4 + 3] > 128) { fila = y; break; }
                cimaColumna[x] = band * (1 - fila / H);
            }
            return { lienzo: L, cimaColumna, panAspect: Wv / Hs, pan: [W / Wv, off / Wv] };
        }

        // ================================================================

        const canvas = document.getElementById('cielo');

        function compilar(tipo, fuente) {

        // ================================================================

        function factorVentanas(h) {
            const pts = [[0, 0.32], [1.5, 0.16], [3.5, 0.07], [5.5, 0.10], [6.5, 0.32], [8, 0.4], [18, 0.55], [20, 0.82], [22.5, 0.78], [24, 0.32]];

        function nombreFaseLunar(frac, creciente) {

            if (Math.abs(frac - 0.5) < 0.06) return creciente ? 'Cuarto creciente' : 'Cuarto menguante';
            if (frac < 0.5) return creciente ? 'Luna creciente' : 'Luna menguante';

        function faseDia(sol) {

            if (e < 0) return manana ? ['alba', 'Alba'] : ['ocaso', 'Ocaso'];
            if (e < 7) return manana ? ['amanecer', 'Amanecer'] : ['hora-dorada', 'Hora dorada'];

        function calcularEstado(ms, aspecto) {
            const n = diasJ2000(ms);
            const lst = ((280.46061837 + 360.98564736629 * n + CONFIG.longitud) % 360 + 360) % 360;
            const solEq = solEcuatorial(n), lunaEq = lunaEcuatorial(n);
            const sol = horizontales(solEq.ra, solEq.dec, lst);
            const luna = horizontales(lunaEq.ra, lunaEq.dec, lst);
            const pSol = posicionPantalla(sol), pLuna = posicionPantalla(luna);

            // Fase lunar
            const vec = (ra, dec) => [Math.cos(dec) * Math.cos(ra), Math.cos(dec) * Math.sin(ra), Math.sin(dec)];
            const vs = vec(solEq.ra, solEq.dec), vl = vec(lunaEq.ra, lunaEq.dec);
            const cosPsi = clamp(vs[0] * vl[0] + vs[1] * vl[1] + vs[2] * vl[2], -1, 1);
            const psi = Math.acos(cosPsi);
            const frac = (1 - cosPsi) / 2;
            const creciente = (((lunaEq.lon - solEq.lon) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) < Math.PI;

            // Exposición automática a partir de la luz del cielo
            const amb = ambienteCielo(sol.e);
            const lumAmb = lum(amb);
            const exposicion = clamp(0.69 / Math.pow(lumAmb + 1e-7, 0.58), 0.5, 42);
            const msK = 0.12 + 0.85 * ss(2, -6, sol.e);

            const T800 = transmitancia(800, sol.e), T35 = transmitancia(3500, sol.e), T7 = transmitancia(7000, sol.e);
            const noche = ss(-3, -12, sol.e);
            const luces = ss(0.5, -4, sol.e);
            const lunaArriba = ss(-1, 15, luna.e);
            const lunaCielo = frac * ss(-2, 25, luna.e) * ss(-2, -10, sol.e);
            const ocultaLuna = ss(0.12, 0.35, psi);   // cerca de la luna nueva no se ve

            const loc = horaLocal(ms);
            const doy = diaDelAno(ms);
            const invierno = 0.5 + 0.5 * Math.cos(2 * Math.PI * (doy - 15) / 365);
            const nieve = 0.12 + 0.88 * ss(0.18, 0.75, 0.5 + 0.5 * Math.cos(2 * Math.PI * (doy - 35) / 365));
            const dias = ms / 864e5;
            const cobertura = clamp(0.30 + 0.5 * (ruidoTiempo(dias * 0.45) - 0.5) + 0.25 * (ruidoTiempo(dias * 2.3 + 40) - 0.5) + 0.12 * invierno, 0.06, 0.66);
            const bruma = (sol.H < 0 ? 1 : 0.3) * ss(-4, 1, sol.e) * (1 - ss(5, 20, sol.e)) * (0.55 + 0.45 * invierno) + 0.06;

            return {
                ms, n, lst, sol, luna, pSol, pLuna, psi, frac, creciente, amb, lumAmb, exposicion, msK,
                T800, T35, T7, noche, luces, lunaArriba, lunaCielo, ocultaLuna, loc, doy, nieve, cobertura, bruma,
                ventanas: factorVentanas(loc.horas)
            };
        }

        // ================================================================
        //  RENDER
        // ================================================================
        const calidadFija = params.get('calidad') ? parseFloat(params.get('calidad')) : null;   // ?calidad=1 desactiva el ajuste automático
        const nubesFijas = params.get('nubes') ? clamp(parseFloat(params.get('nubes')), 0, 1) : null;   // ?nubes=0.6 fuerza la nubosidad
        const escalaBase = Math.min(CONFIG.calidadInicial, 1.25 / Math.min(window.devicePixelRatio || 1, 2));
        let escala = calidadFija ?? escalaBase;
        let tamCSS = [0, 0], dprUsado = 1;
        let estacionPintada = -1;
        const meteoro = { t: -1, dur: 1, a: [0, 0], d: [0, 0] };

        function redimensionar() {
            const w = window.innerWidth, h = window.innerHeight;
            dprUsado = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.max(2, Math.round(w * dprUsado * escala));
            canvas.height = Math.max(2, Math.round(h * dprUsado * escala));
            if (!prog) return;
            if (w !== tamCSS[0] || h !== tamCSS[1] || !paisaje) {
                tamCSS = [w, h];
                repintarPaisaje();
            }
        }

        function repintarPaisaje() {
            const doy = diaDelAno(simMs);
            estacionPintada = Math.floor(doy / 20);
            paisaje = pintarPaisaje(tamCSS[0], tamCSS[1], dprUsado, doy);
            if (gl && prog) {
                subirTextura('uAlb', 0, paisaje.lienzo.alb, { premult: true, mip: true });
                subirTextura('uEmi', 1, paisaje.lienzo.emi, { mip: true });
                subirTextura('uInf', 2, paisaje.lienzo.inf, { nearest: true });
            }
        }

        function ocultacion(px, py, r) {   // fracción del disco tapada por el paisaje
            if (!paisaje) return 0;
            const xv = px * paisaje.pan[0] + paisaje.pan[1];
            const col = paisaje.cimaColumna[clamp(Math.round(px * (paisaje.cimaColumna.length - 1)), 0, paisaje.cimaColumna.length - 1)] || 0;
            const tope = Math.max(sierraY(xv, paisaje.panAspect), colinasY(xv, paisaje.panAspect), px >= 0 && px <= 1 ? col : 0);
            return clamp((tope - (py - r)) / (2 * r), 0, 1);
        }

        function fijarUniformes(st, tReal) {
            const asp = canvas.width / canvas.height;
            const f1 = (n, v) => U[n] && gl.uniform1f(U[n], v);
            const f2 = (n, a, b) => U[n] && gl.uniform2f(U[n], a, b);
            const f3 = (n, v) => U[n] && gl.uniform3f(U[n], v[0], v[1], v[2]);
            const f4 = (n, v) => U[n] && gl.uniform4f(U[n], v[0], v[1], v[2], v[3]);

            const E = st.exposicion;
            f2('uRes', canvas.width, canvas.height);
            f1('uAspect', asp);
            f1('uTime', tReal);
            f2('uPan', paisaje.pan[0], paisaje.pan[1]);
            f1('uPanAspect', paisaje.panAspect);
            f1('uHorizon', CONFIG.horizonte);
            f1('uDegPerY', GRADOS_POR_Y);
            f1('uBand', CONFIG.banda);

            // Sol
            const { pSol, pLuna, sol, luna } = st;
            const ocS = ocultacion(pSol.x, pSol.y, CONFIG.radioSol);
            f3('uSunDir', dirPantalla(pSol.x, pSol.ed, asp));
            f2('uSunPos', pSol.x, pSol.y);
            f1('uSunRadius', CONFIG.radioSol);
            f1('uSunFlat', 0.8 + 0.2 * ss(0, 4, sol.e));
            f3('uSunDisk', v3(st.T800.map(t => Math.pow(t, 0.6)), 12 * ss(-1, 0.5, sol.e)));
            f3('uGlare', v3(st.T800.map(Math.sqrt), 0.9 * (1 - ocS) * ss(-0.5, 2, sol.e)));
            f1('uExposure', E);
            f1('uAtmos', sol.e > -16 ? 1 : 0);
            f3('uMS', v3([0.30, 0.48, 1.0], st.lumAmb * E * st.msK));

            // Luna
            const dS = [(pSol.x - pLuna.x) * asp, pSol.y - pLuna.y];
            const ld = Math.hypot(dS[0], dS[1]) || 1;
            const sp = Math.sin(st.psi);
            f2('uMoonPos', pLuna.x, pLuna.y);
            f1('uMoonRadius', CONFIG.radioLuna);
            f3('uMoonL', [dS[0] / ld * sp, dS[1] / ld * sp, -Math.cos(st.psi)]);
            const TL = transmitancia(800, Math.max(luna.e, 0.2));
            const tmax = Math.max(TL[0], 1e-3);
            f3('uMoonTint', [1, Math.pow(TL[1] / tmax, 0.6), Math.pow(TL[2] / tmax, 0.6)].map(c => c * Math.pow(tmax, 0.4)));
            f1('uMoonFrac', st.frac);
            const visLuna = ss(-1.2, 1.5, pLuna.ed) * st.ocultaLuna;
            f1('uMoonBright', visLuna * (0.36 + 1.9 * st.noche));
            f3('uMoonHalo', v3([0.75, 0.80, 0.92], st.frac * 0.35 * st.noche * visLuna * (1 - ocultacion(pLuna.x, pLuna.y, CONFIG.radioLuna))));
            f1('uMoonSky', st.lunaCielo);

            // Estrellas
            f1('uStarVis', st.noche * (1 - 0.45 * st.lunaCielo));
            f1('uMilky', st.noche * st.noche * (1 - 0.85 * st.lunaCielo) * 0.9);
            f1('uTwinkle', reducirMovimiento ? 0 : 0.35);
            if (U.uToEq) gl.uniformMatrix3fv(U.uToEq, false, matrizEcuatorial(st.lst));

            // Luz sobre el paisaje
            const K = 2.3 * E;
            f3('uSunGround', v3(st.T800, K * ss(-0.6, 0.8, sol.e)));
            f3('uSunHigh', v3(st.T35, K));
            f3('uSunCirrus', v3(st.T7, K));
            const ambNoche = [0.0035, 0.005, 0.011];
            const luzLuna = v3([0.55, 0.62, 0.78], 0.07 * st.frac * st.lunaArriba * st.noche);
            f3('uAmb', [0, 1, 2].map(i => st.amb[i] * E + ambNoche[i] + luzLuna[i] * 0.6));
            const gris = lum(st.amb) * E, rebote = Math.max(Math.sin(sol.e * RAD), 0) * 0.10 * K;
            f3('uAmbLand', [0, 1, 2].map(i => mix(st.amb[i] * E, gris, 0.4) + st.T800[i] * rebote * [1, 0.86, 0.7][i] + ambNoche[i] + luzLuna[i] * 0.6));
            f3('uMoonLight', luzLuna);
            f3('uLightDir', dirLuz(sol));
            f3('uMoonLightDir', dirLuz(luna));
            f3('uCityGlow', v3([0.030, 0.019, 0.010], st.luces));
            f1('uLights', st.luces);
            f1('uWindows', st.ventanas);
            f1('uSnow', st.nieve);
            f1('uMist', st.bruma);
            f1('uCover', nubesFijas ?? st.cobertura);
            f1('uBloom', 0.9);
            const horasSim = st.ms / 3600e3;
            f2('uWind', (reducirMovimiento ? 0 : tReal * 0.004) + (horasSim % 1000) * 0.035, (reducirMovimiento ? 0 : tReal * 0.0012) + (horasSim % 1000) * 0.01);

            // Estrella fugaz
            if (meteoro.t >= 0) {
                f4('uMeteor', [meteoro.a[0] * asp, meteoro.a[1], meteoro.d[0] * asp, meteoro.d[1]]);
                f1('uMeteorT', meteoro.t);
            } else f1('uMeteorT', -1);
        }

        function actualizarMeteoro(dt, st) {
            if (meteoro.t >= 0) {
                meteoro.t += dt / meteoro.dur;
                if (meteoro.t > 1) meteoro.t = -1;
                return;
            }
            if (reducirMovimiento || st.noche < 0.7) return;
            if (Math.random() < dt / 22) {
                const izq = Math.random() < 0.5;
                meteoro.a = [izq ? 0.06 + Math.random() * 0.14 : 0.80 + Math.random() * 0.14, 0.80 + Math.random() * 0.14];
                meteoro.d = [(izq ? -1 : 1) * (0.05 + Math.random() * 0.06), -(0.07 + Math.random() * 0.08)];
                meteoro.dur = 0.6 + Math.random() * 0.7;
                meteoro.t = 0;
            }
        }

        // ================================================================
        //  INTERFAZ Y VARIABLES PARA EL PORTFOLIO
        // ================================================================
        const slider = document.getElementById('slider-hora');
        const textoHora = document.getElementById('texto-hora');
        const textoFecha = document.getElementById('reloj-fecha');
        const textoEstado = document.getElementById('reloj-estado');
        const textoDinamico = document.getElementById('texto-dinamico');
        const botonesVel = document.querySelectorAll('.btn-vel');
        const raiz = document.documentElement;
        const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
        const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        let diaPista = '';

        function colorCentro(st, aspecto) {
            // Color aproximado del cielo detrás del contenido central (para el contraste del texto)
            const rd = dirPantalla(0.5, (0.55 - CONFIG.horizonte) * GRADOS_POR_Y, aspecto);
            const sd = dirPantalla(st.pSol.x, st.pSol.ed, aspecto);
            const c = cieloJS(rd, sd);
            const ms = v3([0.30, 0.48, 1.0], st.lumAmb * st.exposicion * st.msK);
            const nocheBase = [0.0040, 0.0060, 0.0140];
            const lin = [0, 1, 2].map(i => c[i] * st.exposicion + ms[i] + nocheBase[i] + st.lunaCielo * [0.01, 0.016, 0.034][i]);
            return lin.map(x => Math.pow(acesJS(x), 1 / 2.2));
        }

        function actualizarPista(st, aspecto) {
            const clave = `${st.loc.y}-${st.loc.mes}-${st.loc.dia}`;
            if (clave === diaPista) return;
            diaPista = clave;
            const paradas = [];
            for (let h = 0; h <= 24; h += 1) {
                const s = calcularEstado(msDesdeLocal(st.loc.y, st.loc.mes, st.loc.dia, h), aspecto);
                const c = colorCentro(s, aspecto).map(v => Math.round(clamp(v * 1.15, 0, 1) * 255));
                paradas.push(`rgb(${c.join(',')}) ${(h / 24 * 100).toFixed(1)}%`);
            }
            slider.style.setProperty('--pista', `linear-gradient(90deg, ${paradas.join(', ')})`);
        }

        let ultimoUI = 0;
        function actualizarUI(st, aspecto, ahora) {
            if (!arrastrando) slider.value = st.loc.horas.toFixed(3);
            if (ahora - ultimoUI < 120) return;
            ultimoUI = ahora;

            const h = Math.floor(st.loc.horas), m = Math.floor((st.loc.horas - h) * 60);
            textoHora.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            textoFecha.textContent = `${DIAS[st.loc.dow]} ${st.loc.dia} ${MESES[st.loc.mes]}`;
            const [fase, nombreFase] = faseDia(st.sol);
            const luna = nombreFaseLunar(st.frac, st.creciente);
            textoEstado.textContent = `${nombreFase} · ${luna} ${Math.round(st.frac * 100)} %`;
            if (textoDinamico) textoDinamico.textContent = enDirecto ? `Granada · ${nombreFase.toLowerCase()}` : `Granada · ${textoHora.textContent}`;
            actualizarPista(st, aspecto);

            // Contraste del texto según el cielo
            const c = colorCentro(st, aspecto);
            const L = lum(c);
            const t = ss(0.50, 0.62, L);
            const oscuro = [11, 21, 48], claro = [247, 248, 251];
            const tx = oscuro.map((o, i) => Math.round(mix(claro[i], o, t)));
            raiz.style.setProperty('--color-texto', `rgb(${tx.join(',')})`);
            raiz.style.setProperty('--color-texto-suave', `rgba(${tx.join(',')},${(0.72 + 0.08 * t).toFixed(2)})`);
            raiz.style.setProperty('--sombra-texto', t > 0.5 ? '0 1px 24px rgba(255,255,255,0.25)' : '0 1px 24px rgba(3,6,20,0.45)');
            const acento = st.noche > 0.6 ? '#dfe6f5' : fase === 'hora-dorada' || fase === 'ocaso' || fase === 'amanecer' ? '#ffd29a' : t > 0.5 ? '#9a5a1e' : '#f3c77b';
            raiz.style.setProperty('--acento', acento);
            raiz.dataset.fase = fase;
            window.dispatchEvent(new CustomEvent('cielo:cambio', { detail: { fase, nombreFase, luna, iluminacion: st.frac, elevacionSol: st.sol.e, colorCielo: c } }));
        }

        const panel = document.querySelector('.reloj');
        const resumen = document.getElementById('reloj-resumen');
        resumen.addEventListener('click', () => {
            if (!window.matchMedia('(max-width: 640px)').matches) return;
            const abierto = panel.classList.toggle('abierto');
            resumen.setAttribute('aria-expanded', String(abierto));
        });

        function marcarBoton(clave) {
            botonesVel.forEach(b => b.classList.toggle('activo', b.dataset.vel === clave));
        }

        slider.addEventListener('input', e => {
            arrastrando = true;
            enDirecto = false;
            const l = horaLocal(simMs);
            simMs = msDesdeLocal(l.y, l.mes, l.dia, parseFloat(e.target.value));
        });
        slider.addEventListener('change', () => { arrastrando = false; });

        botonesVel.forEach(btn => btn.addEventListener('click', () => {
            if (btn.dataset.vel === 'ahora') {
                simMs = Date.now(); velocidad = 1; enDirecto = true;
            } else {
                velocidad = parseFloat(btn.dataset.vel); enDirecto = false;
            }
            marcarBoton(btn.dataset.vel);
        }));
        if (!enDirecto) marcarBoton(String(velocidad));

        // ================================================================
        //  BUCLE PRINCIPAL
        // ================================================================
        let tPrev = performance.now(), tAcum = 0, muestras = [], ultimoDibujo = 0;
        const t0 = performance.now();

        function bucle(ahora) {
            const dt = Math.min((ahora - tPrev) / 1000, 0.1);
            tPrev = ahora;
            if (enDirecto) simMs = Date.now();
            else if (!arrastrando) simMs += dt * 1000 * velocidad;

            // 30 fps en tiempo real (de sobra para un fondo), fluido si se acelera
            const intervalo = (enDirecto || velocidad <= 1) && !arrastrando ? 1000 / 30 : 0;
            if (ahora - ultimoDibujo < intervalo - 2) { requestAnimationFrame(bucle); return; }
            const dtDibujo = (ahora - ultimoDibujo) / 1000;
            ultimoDibujo = ahora;

            const aspecto = window.innerWidth / window.innerHeight;
            const st = calcularEstado(simMs, aspecto);

            if (gl && prog) {
                if (Math.floor(st.doy / 20) !== estacionPintada) repintarPaisaje();
                actualizarMeteoro(Math.min(dtDibujo, 0.1), st);
                fijarUniformes(st, (ahora - t0) / 1000);
                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                adaptarCalidad(dtDibujo, intervalo);
            } else {
                const c = cieloEnHora(st.loc.horas);
                ['c1', 'c2', 'c3', 'c4', 'c5'].forEach((k, i) => raiz.style.setProperty(`--color-${i + 1}`, c[k]));
            }
            actualizarUI(st, aspecto, ahora);
            requestAnimationFrame(bucle);
        }

        // Baja la resolución si el equipo no llega (y la recupera poco a poco)
        function adaptarCalidad(dt, intervalo) {
            if (calidadFija) return;
            muestras.push(dt);
            if (muestras.length < 45) return;
            const media = muestras.reduce((a, b) => a + b, 0) / muestras.length;
            muestras = [];
            const objetivo = Math.max(intervalo / 1000, 1 / 60);
            if (media > objetivo * 1.45 && escala > 0.45) { escala = Math.max(0.45, escala * 0.82); redimensionar(); }
            else if (media < objetivo * 1.08 && escala < escalaBase) { escala = Math.min(escalaBase, escala * 1.08); redimensionar(); }
        }

        // ================================================================
        //  ARRANQUE
        // ================================================================
        canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); prog = null; });
        canvas.addEventListener('webglcontextrestored', () => {
            try { U = {}; texturas = {}; iniciarGL(); paisaje = null; redimensionar(); } catch (err) { document.body.classList.add('sin-webgl'); }
        });

        let temporizador = null;
        window.addEventListener('resize', () => { clearTimeout(temporizador); temporizador = setTimeout(redimensionar, 150); });

        try {
            if (!gl) throw new Error('Sin WebGL2');
            iniciarGL();
        } catch (err) {
            console.warn('Cielo: usando el degradado de respaldo.', err);
            document.body.classList.add('sin-webgl');
            prog = null;
        }
        redimensionar();
        requestAnimationFrame(bucle);
    </script>
</body>

</html>
